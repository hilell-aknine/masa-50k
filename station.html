<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>תחנה · המסע ל-50K</title>
  <link rel="stylesheet" href="css/portal.css">
  <link rel="stylesheet" href="css/journey-theme.css">
  <script src="js/icons.js"></script>
  <style>
    /* ---------- רכיבים ייחודיים למסך התחנה ---------- */
    .wrap{max-width:var(--maxw);margin:0 auto}

    /* חזרה למפה, בראש הדף · בקשת אוריאן 22.09 */
    .back-map{display:inline-flex;align-items:center;gap:6px;margin:18px auto 0;
      font-size:13.5px;color:var(--text-dim);text-decoration:none;
      padding:8px 0;min-height:44px}
    .back-map:hover{color:var(--text-strong)}

    /* תווית מדרגה + שם הקבוצה */
    .st-tags{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px auto 0}
    .st-tags .tier{font-size:12px;font-weight:700;color:var(--btn-text);background:var(--btn-bg);padding:4px 12px;border-radius:var(--radius-pill)}
    .st-tags .ctitle{font-size:13px;color:var(--text-dim);font-weight:500}

    .st-title{font-size:26px;font-weight:800;color:var(--text-strong);letter-spacing:-.4px;margin:14px auto 4px}
    .st-dur{font-size:13px;color:var(--text-dim);margin-bottom:18px}

    /* אזור וידאו 16:9 */
    .video{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--radius-card);overflow:hidden;background:var(--input-bg);border:1px solid var(--line)}
    .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .video.ph{display:grid;place-items:center;border:2px dashed var(--surface-3);background:var(--surface)}
    .video.ph .phtxt{color:var(--text-dim);font-size:14.5px;text-align:center;padding:0 24px}

    /* תיאור */
    .st-desc{font-size:15px;color:var(--text);margin:20px auto 0;line-height:1.7}
    .st-desc.empty{color:var(--text-dim);opacity:.6;font-style:italic}

    /* מה תפיק מהתחנה */
    .gains{margin:22px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:18px 20px}
    .gains h3{font-size:14px;font-weight:700;color:var(--text-strong);margin-bottom:12px}
    .gains ul{list-style:none}
    .gains li{position:relative;font-size:14px;color:var(--text);padding:6px 24px 6px 0;line-height:1.6}
    .gains li::before{content:"✓";position:absolute;inset-inline-start:0;top:6px;color:var(--btn-bg);font-weight:800;font-size:13px}

    /* ============================================================
       Layout חדש · וידאו + מפת פרק בצד (בקשת אוריאן 24.09.2026,
       לפי הדגמה שהיא צילמה ממערכת קורסים אחרת): שני טורים בדסקטופ
       — וידאו/פרטים מימין (75%), מפת הפרק הצפה משמאל (25%).
       במובייל חוזר לטור אחד: וידאו קודם, מפת הפרק אחריו.
       ============================================================ */
    .station-layout{display:grid;grid-template-columns:minmax(0, 1.5fr) 340px;gap:28px;align-items:start;margin-top:6px;max-width:100%}
    .station-main{grid-column:1;min-width:0}
    .station-map{grid-column:2;position:sticky;top:24px;align-self:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:18px;box-shadow:none}
    @media(max-width:900px){ .station-layout{grid-template-columns:1fr;max-width:none} .station-main,.station-map{grid-column:auto} .station-map{position:static} }
    .station-layout.no-map{grid-template-columns:1fr}

    @media(min-width:1100px){
      .wrap{max-width:1440px}
      .station-layout{grid-template-columns:minmax(0, 1.8fr) 360px;gap:32px}
    }

    .st-sub{font-size:14.5px;color:var(--text-dim);margin:6px auto 16px;line-height:1.6}

    .video-wrap{position:relative}
    /* תג "שיעור ראשי" · מוצג מעל הנגן כששיעור 1 של התחנה מתנגן */
    .video-badge{position:absolute;top:12px;inset-inline-start:12px;z-index:2;display:none;align-items:center;gap:5px;
      background:rgba(15,23,42,.6);backdrop-filter:blur(4px);color:#fcc1cb;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px}
    .video-badge.on{display:inline-flex}
    .video-badge .ic{width:.9em;height:.9em}

    /* שורת פרטי השיעור המנוגן + פעולות · מתחת לנגן */
    .lesson-meta{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
      margin-top:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
    .lesson-meta .lm-title{font-size:16.5px;font-weight:800;color:var(--text-strong);line-height:1.4}
    .lesson-meta .lm-row{display:flex;align-items:center;gap:14px;margin-top:8px;font-size:12.5px;color:var(--text-dim);flex-wrap:wrap}
    .lesson-meta .lm-row span{display:inline-flex;align-items:center;gap:5px}
    .lesson-meta .lm-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .btn-mark{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:11px 18px;
      border-radius:var(--radius-pill);border:1px solid var(--btn-bg);color:var(--btn-bg);background:transparent;
      cursor:pointer;min-height:44px;white-space:nowrap}
    .btn-mark.on{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg)}

    .workbook{margin:18px auto 0}
    .btn-wb{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:11px 18px;border-radius:var(--radius-pill);min-height:44px;text-decoration:none;white-space:nowrap}
    .btn-wb.on{background:var(--surface-2);color:var(--text-strong);border:1px solid var(--line)}
    .btn-wb.off{background:var(--surface);color:var(--text-dim);border:1px solid var(--line);opacity:.6;cursor:not-allowed}

    /* ---------- מפת הפרק (סייד-בר) ---------- */
    .station-map{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:18px;backdrop-filter:none;box-shadow:none}
    .sm-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
    .sm-head h3{font-size:14.5px;font-weight:800;color:var(--text-strong)}
    .sm-head .sm-count{font-size:11px;color:var(--text-dim);white-space:nowrap}
    .sm-progress{height:6px;background:var(--input-bg);border-radius:20px;overflow:hidden;margin:10px 0 18px}
    .sm-progress>span{display:block;height:100%;width:0;background:var(--btn-bg);border-radius:20px;transition:width .4s}
    .sm-list{position:relative}
    .sm-item{position:relative;display:flex;gap:12px;padding-bottom:18px;cursor:pointer;border-radius:12px;transition:background .15s}
    .sm-item:last-child{padding-bottom:0}
    .sm-item:hover{background:rgba(30,58,95,.02)}
    /* קו מחבר אנכי בין הנקודות · מיושר לפי מרכז ה-dot (24px), בצד ימין
       בפועל כי הפריסה RTL הופכת את הפריט הראשון בפלקס לימני. */
    .sm-item::before{content:"";position:absolute;top:26px;bottom:0;right:11px;width:2px;background:var(--line)}
    .sm-item:last-child::before{display:none}
    .sm-dot{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;z-index:1;
      background:var(--input-bg);border:2px solid var(--line);color:var(--text-dim);font-size:11px;transition:.15s}
    .sm-item.done .sm-dot{background:#22c55e;border-color:#22c55e;color:#fff}
    .sm-item.current .sm-dot{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-text)}
    .sm-item:hover .sm-dot{border-color:var(--btn-bg)}
    .sm-body{flex:1;min-width:0;padding-top:1px}
    .sm-name{display:block;font-size:13.5px;font-weight:600;color:var(--text)}
    .sm-item.current .sm-name{color:var(--text-strong);font-weight:800}
    .sm-min{display:block;font-size:11.5px;color:var(--text-faint);margin-top:3px}
    .sm-star{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--btn-bg);margin-top:3px}
    .sm-star .ic{width:.9em;height:.9em}
    .sm-nav{margin-top:22px;display:flex;flex-direction:column;gap:10px}
    .sm-next{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--btn-bg);color:var(--btn-text);
      font-weight:800;font-size:14px;padding:13px 18px;border-radius:var(--radius-pill);border:none;cursor:pointer;
      text-decoration:none;min-height:46px}
    .sm-next.off{opacity:.4;pointer-events:none}
    .sm-prev{text-align:center;font-size:12.5px;color:var(--text-dim);text-decoration:none;padding:6px}
    .sm-prev:hover{color:var(--text-strong)}
    .sm-prev.off{opacity:.35;pointer-events:none}

    /* פעולות */
    .actions{margin:30px auto 0;display:flex;flex-direction:column;gap:12px}
    .btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--btn-bg);color:var(--btn-text);font-weight:800;font-size:16px;padding:16px 24px;border-radius:var(--radius-pill);border:none;cursor:pointer;min-height:54px;width:100%}
    .btn-primary:active{transform:translateY(1px)}
    .btn-secondary{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:transparent;color:var(--text-dim);font-weight:600;font-size:14px;padding:12px 18px;border-radius:var(--radius-pill);border:1px solid var(--line);text-decoration:none;min-height:44px}

    /* ניווט תחנה קודמת/הבאה */
    .stepnav{display:flex;justify-content:space-between;gap:10px;margin:22px auto 0}
    .stepnav a,.stepnav span{flex:1;text-align:center;font-size:13.5px;padding:12px 10px;border-radius:var(--radius-card);min-height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
    .stepnav a{color:var(--text);background:var(--surface);text-decoration:none}
    .stepnav span{color:var(--text-dim);opacity:.4;background:transparent}

    /* מסך נעול */
    .locked-card{max-width:var(--maxw);margin:60px auto 0;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:42px 26px}
    .locked-card .ic{font-size:42px}
    .locked-card h2{font-size:21px;font-weight:800;color:var(--text-strong);margin-top:16px}
    .locked-card p{font-size:14.5px;color:var(--text-dim);margin-top:10px;line-height:1.6}
    .locked-card .btn-secondary{margin-top:26px}

    /* תיבת תוכן משותפת · משמשת כרגע רק את תגובות הקהילה (.notes.talk) */
    .notes{margin:22px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:18px 20px}
    .notes .nh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
    .notes h3{font-size:14px;font-weight:700;color:var(--text-strong)}
    .notes textarea{width:100%;min-height:110px;resize:vertical;background:var(--input-bg);border:1px solid var(--line);border-radius:12px;padding:13px 15px;color:var(--text);font-family:Inter,sans-serif;font-size:14px;line-height:1.6;outline:none}
    .notes textarea::placeholder{color:var(--text-faint)}
    .notes .hint{font-size:11.5px;color:var(--text-faint);margin-top:8px}
    /* תגובות פומביות · שדה נפרד מההערות הפרטיות */
    .notes.talk{margin-top:14px}
    .cempty{font-size:13px;color:var(--text-faint);padding:10px 0 14px}
    .citem{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
    .citem .av{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;
      background:var(--input-bg);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--text-strong)}
    .citem .cb{flex:1;min-width:0}
    .citem .cwho{font-size:12.5px;font-weight:700;color:var(--text-strong)}
    .citem .cwho .tag{font-size:10.5px;font-weight:700;margin-inline-start:6px;padding:2px 7px;
      border-radius:30px;background:#C2456A;color:#fff}
    .citem .cwhen{font-size:11px;color:var(--text-faint);margin-inline-start:7px;font-weight:400}
    .citem .ctxt{font-size:13.5px;line-height:1.65;color:var(--text);margin-top:3px;
      white-space:pre-wrap;overflow-wrap:anywhere}
    .cacts{flex:none;display:flex;flex-direction:column;gap:2px;align-self:flex-start}
    .citem .cdel{background:none;border:0;color:var(--text-faint);cursor:pointer;
      font-size:11.5px;padding:4px 6px;font-family:inherit;white-space:nowrap}
    .citem .cdel:hover{color:var(--text-strong)}
    .citem .cdel:disabled{opacity:.6;cursor:default}
    .crow{display:flex;align-items:center;gap:12px;margin-top:10px}
    .cpost{background:var(--text-strong);color:var(--surface);border:0;border-radius:var(--radius-pill);
      min-height:44px;padding:0 22px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
    .cpost:disabled{opacity:.55;cursor:default}
    .cmsg{font-size:12px;color:var(--text-faint)}

    /* ============================================================
       תיבת התגובות לבנה · בקשת אוריאן 09.09.2026.
       בלשונה: "להפוך את התיבה הזו לצבע לבן".
       הצבעים כתובים במפורש ולא דרך טוקנים, כדי שהתיבה תישאר לבנה
       וקריאה גם במצב הכהה של הפורטל. כל הטקסטים כהים על לבן,
       הבהיר ביותר הוא ‎#6B7280 ביחס ניגודיות 5.2:1 מול לבן.
       ============================================================ */
    .notes.talk{background:#FFFFFF;border-color:#E5E7EB}
    .notes.talk h3{color:#111827}
    .notes.talk .nh [data-ic]{color:#1E3A5F}
    .notes.talk .hint{color:#4B5563}
    .notes.talk .cempty{color:#6B7280}
    .notes.talk .citem{border-bottom-color:#E5E7EB}
    .notes.talk .citem .av{background:#F3F4F6;border-color:#E5E7EB;color:#111827}
    .notes.talk .citem .cwho{color:#111827}
    .notes.talk .citem .cwhen{color:#6B7280}
    .notes.talk .citem .ctxt{color:#1F2937}
    .notes.talk .citem .cdel{color:#6B7280}
    .notes.talk .citem .cdel:hover{color:#111827}
    .notes.talk textarea{background:#FFFFFF;border-color:#D1D5DB;color:#111827}
    .notes.talk textarea::placeholder{color:#6B7280}
    .notes.talk textarea:focus{border-color:#1E3A5F}
    .notes.talk .cpost{background:#1E3A5F;color:#FFFFFF}
    .notes.talk .cmsg{color:#4B5563}

    @media(max-width:520px){
      .st-title{font-size:22px}
      .btn-primary{font-size:15px}
    }
  </style>
<!-- שער כניסה · חייב להיטען לפני שאר סקריפטי הדף -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<!-- נדרש ליועצת הדיגיטלית: הקריאה ל-askAdvisor רצה דרך Cloud Functions -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/gate.js"></script>
<script src="js/nav.js"></script>
<!-- חוברת העבודה שהתלמידה ממלאת · מתלבש על #wbForm בגוף הדף -->
<script src="js/workbook-form.js"></script>
<!-- YouTube IFrame API · מאפשר מעקב זמן צפייה אמיתי (בקשת אוריאן 16.09: וי ירוק אחרי 80% מהסרטון) -->
<script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

  <main id="app" class="wrap"></main>

  <div class="credit">נבנה ע"י <b>הלל אקנין</b></div>

  <script src="data/content.js"></script>
  <script src="js/lesson-progress.js"></script>
  <script>
  (function(){
    /* ============================================================
       נעילת ההתקדמות · כבויה זמנית לקראת ההשקה (החלטת הלל 09.09.2026)
       false = אפשר להיכנס לכל תחנה, גם בקישור ישיר בכתובת.
       true  = חוזרים לנעילה הסדרתית.
       ⚠️ חייב להיות זהה לקבוע שבראש הסקריפט ב-index.html.
       ============================================================ */
    var PROGRESS_LOCK_ENABLED = false;

    /* ============================================================
       בלוק "מה תפיק מהתחנה" · מוסתר לבקשת אוריאן 09.09.2026.
       בלשונה: "כאן ראיתי שזה מופיע בכל פרק, לדעתי כרגע נוריד את זה
       עד שנבין איך לקחת את התמלול ובאמת לתת נושאים שיהיו מסקרנים".
       הבלוק היה גנרי וזהה בכל 11 הפרקים ולכן לא הוסיף ערך.
       ⚠️ הקוד לא נמחק. כשיהיו נושאים אמיתיים מהתמלול, מחזירים ל-true.
       ============================================================ */
    var SHOW_STATION_GAINS = false;

    /* ============================================================
       אורכי השיעורים · מוסתרים לבקשת אוריאן 22.09.2026.
       בלשונה, מתוך ההקלטה: "יש שם גם אני רואה שמונה דקות עשר
       דקות זה סתם, זה לא מעניין כמה זמן זה."
       מסתיר גם את התווית על כרטיס השיעור וגם את סך התחנה.
       ⚠️ הקוד והנתונים לא נמחקו. הדקות עדיין יושבות ב-content.js
          ומשמשות לחישובים, רק לא מוצגות. החזרה = true.
       ============================================================ */
    var SHOW_DURATIONS = false;

    var PROGRESS_KEY = 'oriane_journey_progress';

    // ---------- פרמטר ?id ----------
    var params = new URLSearchParams(location.search);
    var id = parseInt(params.get('id'), 10);

    var stations = (window.COURSE && window.COURSE.allStations) || [];
    var total = stations.length;
    var station = stations.find(function(s){ return s.id == id; });

    // נקרא דרך OrianeLessons, שהוא המקור היחיד מאז שההתקדמות
    // עברה לשרת (26.09). נפילה חזרה ל-localStorage אם המודול חסר.
    var done = window.OrianeLessons
      ? window.OrianeLessons.stationDone()
      : parseInt(localStorage.getItem(PROGRESS_KEY), 10);
    // ברירת מחדל 0 ולא 3, אחרת שלוש תחנות נחשבות מושלמות בלי שנצפו.
    if (isNaN(done)) done = 0;

    var app = document.getElementById('app');

    function esc(t){
      var d = document.createElement('div');
      d.textContent = t == null ? '' : t;
      return d.innerHTML;
    }

    // ---------- תחנה לא קיימת ----------
    if (!station) {
      app.innerHTML =
        '<div class="locked-card">' +
          '<div class="ic"><span data-ic="compass"></span></div>' +
          '<h2>התחנה לא נמצאה</h2>' +
          '<p>לא הצלחנו לאתר את התחנה המבוקשת.</p>' +
          '<a class="btn-secondary" href="index.html">→ חזרה למפה</a>' +
        '</div>';
      document.title = 'תחנה · המסע ל-50K';
      return;
    }

    // ---------- נעילת התקדמות ----------
    if (PROGRESS_LOCK_ENABLED && station.id > done + 1) {
      app.innerHTML =
        '<div class="locked-card">' +
          '<div class="ic"><span data-ic="lock"></span></div>' +
          '<h2>התחנה הזו עדיין נעולה</h2>' +
          '<p>סיים את התחנה הקודמת כדי לפתוח אותה.</p>' +
          '<a class="btn-secondary" href="index.html">→ חזרה למפה</a>' +
        '</div>';
      document.title = 'נעול · המסע ל-50K';
      return;
    }

    // ---------- תחנה פתוחה ----------
    document.title = 'תחנה ' + station.id + ' · המסע ל-50K';

    var hasLessons = !!(station.lessons && station.lessons.length);

    // אזור וידאו
    var videoHtml;
    // אם יש שיעורים, הנגן פותח את השיעור שנבחר בכתובת
    var openId = station.youtubeId;
    var lessonIdx = Math.max(0, (parseInt(params.get('l'), 10) || 1) - 1);
    if (hasLessons) {
      if (lessonIdx >= station.lessons.length) lessonIdx = 0;
      openId = station.lessons[lessonIdx].youtubeId || openId;
    }
    if (openId) {
      videoHtml =
        '<div class="video">' +
          '<iframe id="stFrame" src="https://www.youtube.com/embed/' + encodeURIComponent(openId) +
            '?enablejsapi=1&origin=' + encodeURIComponent(location.origin) + '" ' +
            'title="' + esc(station.name) + '" allowfullscreen ' +
            'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>' +
        '</div>';
    } else {
      videoHtml =
        '<div class="video ph"><div class="phtxt"><span data-ic="play"></span> כאן ייכנס הסרטון של התחנה</div></div>';
    }
    // תג "שיעור ראשי" מעל הנגן · מוצג כששיעור 1 של התחנה מתנגן (בקשת אוריאן 24.09)
    var videoWrapHtml =
      '<div class="video-wrap">' +
        (hasLessons ? '<div class="video-badge' + (lessonIdx === 0 ? ' on' : '') + '" id="videoBadge"><span data-ic="star"></span> שיעור ראשי</div>' : '') +
        videoHtml +
      '</div>';

    // מסיר מ-l.n את המספור הפנימי הקיים ("1 · שם") כדי לבנות מספור
    // "פרק.שיעור" (למשל 7.1) כמו בהדגמה של אוריאן, בלי לשכפל אותו.
    function cleanLessonName(n) { return String(n || '').replace(/^\d+\s*[·.]\s*/, ''); }
    function lessonLabel(i) { return station.id + '.' + (i + 1) + ' · ' + esc(cleanLessonName(station.lessons[i].n)); }

    // ---------- שורת פרטי השיעור המנוגן + כפתורי פעולה (מתחת לנגן) ----------
    var wbHtml = station.workbookUrl
      ? '<a class="btn-wb on" href="' + esc(station.workbookUrl) + '" download target="_blank" rel="noopener"><span data-ic="book"></span> הורד חוברת עבודה</a>'
      : '<span class="btn-wb off"><span data-ic="book"></span> חוברת עבודה · תתווסף</span>';

    var lessonMetaHtml = '';
    if (hasLessons) {
      var curLesson = station.lessons[lessonIdx];
      var isDoneNow = window.OrianeLessons && window.OrianeLessons.isWatched(station.id, lessonIdx);
      lessonMetaHtml =
        '<div class="lesson-meta">' +
          '<div class="lm-left">' +
            '<h2 class="lm-title" id="lmTitle">' + lessonLabel(lessonIdx) + '</h2>' +
            '<div class="lm-row" id="lmRow">' +
              (SHOW_DURATIONS ? '<span><span data-ic="clock"></span>' + esc(curLesson.min) + ' דק׳</span>' : '') +
              '<span><span data-ic="compass"></span> רמת התקדמות: ' + esc(station.chapterTitle) + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="lm-actions">' +
            '<button class="btn-mark' + (isDoneNow ? ' on' : '') + '" id="markDoneBtn" type="button">' +
              '<span data-ic="check"></span><span id="markDoneTxt">' + (isDoneNow ? 'סומן כהושלם' : 'סימון כהושלם') + '</span>' +
            '</button>' +
            wbHtml +
          '</div>' +
        '</div>';
    }

    // תיאור · מוצג כתקציר מתחת לכותרת הראשית (בקשת אוריאן 24.09, לפי ההדגמה)
    var descHtml = station.desc
      ? '<p class="st-sub">' + esc(station.desc) + '</p>'
      : '<p class="st-sub" style="opacity:.6;font-style:italic">תיאור התחנה יתווסף עם התוכן</p>';

    // מה תפיק מהתחנה (מסגרת כללית, ללא תוכן שיעור ספציפי)
    var gains = [
      'הבנה ברורה של "' + station.name + '" ואיך הוא מתחבר ליעד ה-50K',
      'כלים מעשיים שאפשר ליישם כבר אחרי הצפייה',
      'צעדים קונקרטיים שמקדמים אותך לתחנה הבאה במסע',
      'נקודת מדידה לראות איפה אתה עומד היום ולאן ממשיכים'
    ];
    var gainsHtml = !SHOW_STATION_GAINS ? '' :
      '<div class="gains">' +
        '<h3>מה תפיק מהתחנה</h3>' +
        '<ul>' +
          gains.map(function(g){ return '<li>' + esc(g) + '</li>'; }).join('') +
        '</ul>' +
      '</div>';

    // משך (רק לתחנת וידאו יחיד בלי שיעורים · עם שיעורים המשך מוצג ב-lesson-meta)
    var durHtml = (!hasLessons && SHOW_DURATIONS && station.durationMin)
      ? '<div class="st-dur"><span data-ic="clock"></span> כ-' + esc(station.durationMin) + ' דק׳</div>'
      : '';

    // ---------- מפת הפרק (סייד-בר) · מחליפה את קרוסלת השיעורים הישנה ----------
    var mapHtml = '';
    if (hasLessons) {
      var totalLessons = station.lessons.length;
      var doneCountSidebar = station.lessons.filter(function (_, i) {
        return window.OrianeLessons && window.OrianeLessons.isWatched(station.id, i);
      }).length;
      var percent = totalLessons ? Math.round(doneCountSidebar / totalLessons * 100) : 0;

      var itemsHtml = station.lessons.map(function (l, i) {
        var isDone = window.OrianeLessons && window.OrianeLessons.isWatched(station.id, i);
        var isCurrent = i === lessonIdx;
        var stateCls = isDone ? ' done' : (isCurrent ? ' current' : '');
        var dotInner = isDone ? '<span data-ic="check"></span>' : (isCurrent ? '<span data-ic="play"></span>' : (i + 1));
        return '<div class="sm-item' + stateCls + '" data-i="' + i + '" data-yt="' + esc(l.youtubeId) + '">' +
                 '<div class="sm-dot" data-dot-i="' + i + '">' + dotInner + '</div>' +
                 '<div class="sm-body">' +
                   '<span class="sm-name">' + lessonLabel(i) + '</span>' +
                   (SHOW_DURATIONS ? '<span class="sm-min">' + esc(l.min) + ' דק׳</span>' : '') +
                   (i === 0 ? '<span class="sm-star"><span data-ic="star"></span> שיעור ראשי</span>' : '') +
                 '</div>' +
               '</div>';
      }).join('');

      mapHtml =
        '<aside class="station-map">' +
          '<div class="sm-head"><h3>מפת הפרק</h3><span class="sm-count">' + doneCountSidebar + ' מתוך ' + totalLessons + ' הושלמו</span></div>' +
          '<div class="sm-progress"><span id="smProgressFill" style="width:' + percent + '%"></span></div>' +
          '<div class="sm-list" id="smList">' + itemsHtml + '</div>' +
          '<div class="sm-nav" id="smNav"></div>' +
        '</aside>';
    }

    // ניווט קודם/הבא · ברמת התחנה (מדרגה שלמה), נשאר בתחתית הדף
    var prevId = station.id - 1;
    var nextId = station.id + 1;
    var prevHtml = prevId >= 1
      ? '<a href="station.html?id=' + prevId + '">→ התחנה הקודמת</a>'
      : '<span>→ התחנה הקודמת</span>';
    // הבאה זמינה רק אם לא חורגת מהנעילה הנוכחית.
    // כשהנעילה כבויה כל תחנה קיימת זמינה, אחרת הקישור היה מת בכל התחנות.
    var nextHtml = (nextId <= total && (!PROGRESS_LOCK_ENABLED || nextId <= done + 1))
      ? '<a href="station.html?id=' + nextId + '">התחנה הבאה ←</a>'
      : '<span>התחנה הבאה ←</span>';

    // תגובות פומביות · שדה נפרד לגמרי מההערות הפרטיות (החלטת הלל 08.09)
    var commentsHtml =
      '<div class="notes talk">' +
        '<div class="nh"><h3><span data-ic="note"></span> מה כתבו כאן</h3></div>' +
        '<div class="hint" style="margin:0 0 12px">👥 מה שתכתבי כאן מוצג בשם שלך לכל המשתתפות בתחנה הזו.</div>' +
        '<div id="cList"><div class="cempty">טוען...</div></div>' +
        '<textarea id="cArea" maxlength="1000" placeholder="כתבו כאן תגובה לקהילת המסע"></textarea>' +
        '<div class="crow">' +
          '<button class="cpost" id="cPost" type="button">פרסום</button>' +
          '<span class="cmsg" id="cMsg"></span>' +
        '</div>' +
      '</div>';

    app.innerHTML =
      // חזרה למפה בראש הדף · בקשת אוריאן 22.09: "שיהיה גם כפתור
      // כזה חץ חזרה למסע הבית". הקישור התחתון נשאר, אבל הוא היה
      // מגיע רק אחרי כל הגלילה וזו הייתה התלונה.
      '<a class="back-map" href="index.html">→ חזרה למסע</a>' +
      '<div class="st-tags">' +
        // dir=ltr כי "0 → 10K" מתהפך ויזואלית ל-"10K → 0" בהקשר RTL,
        // ואז נראה כאילו המדרגה יורדת מ-10K לאפס.
        '<span class="tier" dir="ltr">' + esc(station.tier) + '</span>' +
        '<span class="ctitle">' + esc(station.chapterTitle) + '</span>' +
      '</div>' +
      '<h1 class="st-title">תחנה ' + station.id + ' · ' + esc(station.name) + '</h1>' +
      descHtml +
      '<div class="station-layout' + (hasLessons ? '' : ' no-map') + '">' +
        '<div class="station-main">' +
          durHtml +
          videoWrapHtml +
          lessonMetaHtml +
          gainsHtml +
          (!hasLessons ? '<div class="workbook">' + wbHtml + '</div>' : '') +
          // חוברת העבודה האינטראקטיבית · js/workbook-form.js מתלבש על זה.
          // מסתיר את עצמו לבד כשאוריאן עוד לא הגדירה שאלות לתחנה.
          '<div id="wbForm" data-station="' + station.id + '"></div>' +
        '</div>' +
        mapHtml +
      '</div>' +
      commentsHtml +
      '<div class="actions">' +
        '<button class="btn-primary" id="finishBtn">סיימתי את התחנה ✓ · לתחנה הבאה</button>' +
        '<a class="btn-secondary" href="index.html">→ חזרה למפה</a>' +
      '</div>' +
      '<div class="stepnav">' + prevHtml + nextHtml + '</div>';

    // ---------- ניווט "לשיעור הבא/הקודם" במפת הפרק (חוצה גם תחנות) ----------
    if (hasLessons) {
      function lessonPageUrl(stationId, li) { return 'station.html?id=' + stationId + '&l=' + (li + 1); }
      var prevStation = stations.find(function (s) { return s.id === prevId; });
      var prevStationLastLesson = (prevStation && prevStation.lessons && prevStation.lessons.length) ? prevStation.lessons.length - 1 : null;

      var nextUrl = (lessonIdx + 1 < station.lessons.length)
        ? lessonPageUrl(station.id, lessonIdx + 1)
        : ((nextId <= total && (!PROGRESS_LOCK_ENABLED || nextId <= done + 1)) ? 'station.html?id=' + nextId : null);
      var prevUrl = (lessonIdx - 1 >= 0)
        ? lessonPageUrl(station.id, lessonIdx - 1)
        : (prevId >= 1 ? ('station.html?id=' + prevId + (prevStationLastLesson != null ? '&l=' + (prevStationLastLesson + 1) : '')) : null);

      var smNav = document.getElementById('smNav');
      if (smNav) {
        smNav.innerHTML =
          (nextUrl
            ? '<a class="sm-next" href="' + nextUrl + '">לשיעור הבא <span data-ic="play"></span></a>'
            : '<span class="sm-next off">לשיעור הבא</span>') +
          (prevUrl
            ? '<a class="sm-prev" href="' + prevUrl + '">← לשיעור הקודם</a>'
            : '<span class="sm-prev off">← לשיעור הקודם</span>');
      }
    }

    // ---------- מעקב צפייה אמיתית · וי ירוק אחרי 80% מהסרטון ----------
    // בקשת אוריאן 16.09: "האימוג'י הזה ייצבע ברגע שהיוזר צפה ב-80%
    // מהסרטון". לכן השיעור מסומן "נצפה" (markWatched) רק כשהתקדמות
    // הצפייה בפועל, לפי ה-YouTube IFrame API, חוצה את סף ה-80%,
    // ולא ברגע שהנגן נפתח כמו קודם.
    var ytPlayer = null;
    var ytPollTimer = null;
    var currentLessonIdx = lessonIdx;

    // מעדכן את מפת הפרק (dot ירוק + progress bar + מונה) בלי רענון דף,
    // גם כשהסימון מגיע מהצפייה האוטומטית וגם מלחיצה ידנית על הכפתור.
    function refreshMapProgress() {
      if (!hasLessons) return;
      var doneNow = station.lessons.filter(function (_, i) {
        return window.OrianeLessons && window.OrianeLessons.isWatched(station.id, i);
      }).length;
      var totalLessons = station.lessons.length;
      var pct = totalLessons ? Math.round(doneNow / totalLessons * 100) : 0;
      var countEl = document.querySelector('.sm-count');
      if (countEl) countEl.textContent = doneNow + ' מתוך ' + totalLessons + ' הושלמו';
      var fillEl = document.getElementById('smProgressFill');
      if (fillEl) fillEl.style.width = pct + '%';
    }

    function markLessonWatched(idx) {
      if (idx == null || !window.OrianeLessons) return;
      var already = window.OrianeLessons.isWatched(station.id, idx);
      window.OrianeLessons.markWatched(station.id, idx);
      if (already) return;
      var item = document.querySelector('.sm-item[data-i="' + idx + '"]');
      if (item) {
        item.classList.add('done');
        item.classList.remove('current');
        var dot = item.querySelector('.sm-dot');
        if (dot) dot.innerHTML = window.icHTML ? window.icHTML('check') : '✓';
      }
      if (idx === currentLessonIdx) {
        var markBtn = document.getElementById('markDoneBtn');
        if (markBtn) {
          markBtn.classList.add('on');
          var txt = document.getElementById('markDoneTxt');
          if (txt) txt.textContent = 'סומן כהושלם';
        }
      }
      refreshMapProgress();
    }

    function startYtWatchPolling() {
      if (ytPollTimer) return;
      ytPollTimer = setInterval(function () {
        if (!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') return;
        try {
          if (ytPlayer.getPlayerState() !== 1 /* YT.PlayerState.PLAYING */) return;
          var dur = ytPlayer.getDuration();
          if (!dur) return;
          var frac = ytPlayer.getCurrentTime() / dur;
          if (frac >= 0.8) markLessonWatched(currentLessonIdx);
        } catch (e) {}
      }, 1000);
    }

    function createYtPlayer() {
      if (!document.getElementById('stFrame') || !window.YT || !window.YT.Player) return;
      ytPlayer = new YT.Player('stFrame', {
        events: {
          onReady: startYtWatchPolling,
          onStateChange: function (ev) {
            if (ev.data === 1 /* PLAYING */) startYtWatchPolling();
          }
        }
      });
    }

    if (openId) {
      if (window.YT && window.YT.Player) {
        createYtPlayer();
      } else {
        // ה-API עוד בטעינה · מצטרפים לתור, בלי לדרוס callback אחר בעמוד
        var prevReady = window.onYouTubeIframeAPIReady;
        window.onYouTubeIframeAPIReady = function () {
          if (typeof prevReady === 'function') prevReady();
          createYtPlayer();
        };
      }
    }

    // ---------- כפתור "סימון כהושלם" · סימון ידני מיידי, לצד המעקב האוטומטי ----------
    var markDoneBtn = document.getElementById('markDoneBtn');
    if (markDoneBtn) {
      markDoneBtn.addEventListener('click', function () {
        markLessonWatched(currentLessonIdx);
      });
    }

    // ---------- כניסה לשיעור ספציפי ממפת הפרק ----------
    var smItems = document.querySelectorAll('.sm-item');
    Array.prototype.forEach.call(smItems, function (el) {
      el.addEventListener('click', function () {
        var i = parseInt(el.getAttribute('data-i'), 10);
        var yt = el.getAttribute('data-yt');
        var lesson = station.lessons[i];
        currentLessonIdx = i;

        // מעדיף להחליף וידאו דרך ה-player (jsapi) כדי שהמעקב אחרי 80%
        // ימשיך לעבוד; אם ה-API עוד לא נטען, נופל חזרה על שינוי ה-src.
        if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
          ytPlayer.loadVideoById(yt);
        } else {
          var frame = document.getElementById('stFrame');
          if (frame) frame.src = 'https://www.youtube.com/embed/' + encodeURIComponent(yt) + '?autoplay=1&enablejsapi=1&origin=' + encodeURIComponent(location.origin);
        }

        // מצב "current" עובר לפריט הנוכחי בלבד (מי שכבר "done" נשאר done)
        Array.prototype.forEach.call(smItems, function (o) {
          if (!o.classList.contains('done')) {
            o.classList.remove('current');
            var d = o.querySelector('.sm-dot');
            if (d) d.textContent = parseInt(o.getAttribute('data-i'), 10) + 1;
          }
        });
        if (!el.classList.contains('done')) {
          el.classList.add('current');
          var dot = el.querySelector('.sm-dot');
          if (dot) dot.innerHTML = window.icHTML ? window.icHTML('play') : '▶';
        }

        // תג "שיעור ראשי" מעל הנגן · מוצג רק כששיעור 1 מתנגן
        var badge = document.getElementById('videoBadge');
        if (badge) badge.classList.toggle('on', i === 0);

        // שורת פרטי השיעור מתעדכנת לשיעור החדש
        var lmTitle = document.getElementById('lmTitle');
        if (lmTitle) lmTitle.textContent = station.id + '.' + (i + 1) + ' · ' + (lesson.n || '').replace(/^\d+\s*[·.]\s*/, '');
        var markBtn = document.getElementById('markDoneBtn');
        if (markBtn) {
          var isDoneNow = window.OrianeLessons && window.OrianeLessons.isWatched(station.id, i);
          markBtn.classList.toggle('on', !!isDoneNow);
          var txt = document.getElementById('markDoneTxt');
          if (txt) txt.textContent = isDoneNow ? 'סומן כהושלם' : 'סימון כהושלם';
        }

        // הכתובת משקפת את השיעור, כך שאפשר לשלוח קישור ישיר אליו
        try {
          var u = new URL(location.href);
          u.searchParams.set('l', i + 1);
          history.replaceState(null, '', u.toString());
        } catch (e) {}

        var frameEl = document.getElementById('stFrame');
        if (frameEl) frameEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    });

    // ---------- סיום תחנה ----------
    document.getElementById('finishBtn').addEventListener('click', function(){
      /* המודול כותב מקומית מיידית ודוחף לשרת ברקע. הניווט מיד
         אחריו בטוח: הכתיבה המקומית כבר קרתה, והדחיפה שלא הספיקה
         תעלה במיזוג בטעינה הבאה. */
      if (window.OrianeLessons) window.OrianeLessons.markStationDone(station.id);
      else localStorage.setItem(PROGRESS_KEY, Math.max(done, station.id));
      location.href = 'index.html';
    });

    // ---------- תגובות פומביות בתחנה ----------
    // שדה נפרד לגמרי מההערות הפרטיות. כאן כותבות בשם מלא וכולן רואות.
    // אוריאן מוחקת כל תגובה, וכל אחת מוחקת את שלה. אכיפה בכללי השרת.
    (function () {
      var db = window.ORIANE_DB;
      var meUser = window.ORIANE_USER || {};
      var list = document.getElementById('cList');
      var area = document.getElementById('cArea');
      var post = document.getElementById('cPost');
      var cmsg = document.getElementById('cMsg');
      if (!db || !list) return;

      function when(ts) {
        if (!ts || typeof ts.toDate !== 'function') return '';
        var d = ts.toDate(), diff = (Date.now() - d.getTime()) / 1000;
        if (diff < 60) return 'ממש עכשיו';
        if (diff < 3600) return 'לפני ' + Math.floor(diff / 60) + ' דק׳';
        if (diff < 86400) return 'לפני ' + Math.floor(diff / 3600) + ' שעות';
        return d.toLocaleDateString('he-IL');
      }

      function draw(items) {
        if (!items.length) {
          list.innerHTML = '<div class="cempty">עוד לא כתבו כאן. את יכולה להיות הראשונה.</div>';
          return;
        }
        list.innerHTML = items.map(function (c) {
          var nm = (c.name || 'משתתפת').trim();
          var mine = c.uid === meUser.uid;
          var canDel = mine || meUser.isAdmin;
          return '<div class="citem">' +
            '<div class="av">' + esc(nm.charAt(0).toUpperCase() || '🙂') + '</div>' +
            '<div class="cb">' +
              '<div class="cwho">' + esc(nm) +
                (c.isAdmin ? '<span class="tag">אוריאן</span>' : '') +
                '<span class="cwhen">' + esc(when(c.created_at)) + '</span>' +
              '</div>' +
              '<div class="ctxt">' + esc(c.body) + '</div>' +
            '</div>' +
            '<div class="cacts">' +
              (canDel ? '<button class="cdel" data-del="' + esc(c.id) + '" title="מחיקה">מחיקה</button>' : '') +
              (!mine ? '<button class="cdel" data-report="' + esc(c.id) + '" title="דיווח לאוריאן">דיווח</button>' : '') +
            '</div>' +
          '</div>';
        }).join('');

        Array.prototype.forEach.call(list.querySelectorAll('[data-del]'), function (b) {
          b.addEventListener('click', function () {
            if (!confirm('למחוק את התגובה?')) return;
            b.disabled = true;
            db.collection('comments').doc(b.getAttribute('data-del')).delete()
              .catch(function (e) { b.disabled = false; cmsg.textContent = 'המחיקה נכשלה'; console.error(e); });
          });
        });

        // דיווח · נשלח לאוריאן בלבד, והמדווחת לא נחשפת לשאר המשתתפות
        Array.prototype.forEach.call(list.querySelectorAll('[data-report]'), function (b) {
          b.addEventListener('click', function () {
            var cid = b.getAttribute('data-report');
            var c = items.filter(function (x) { return x.id === cid; })[0];
            if (!c) return;
            if (!confirm('לדווח על התגובה הזו לאוריאן?\n\nהיא תראה את התגובה ואת מי שכתב אותה. שאר המשתתפות לא יידעו שדיווחת.')) return;
            b.disabled = true;
            b.textContent = 'שולח...';
            db.collection('reports').add({
              commentId: cid,
              stationId: station.id,
              stationName: station.name || '',
              commentBody: String(c.body || '').slice(0, 1100),
              commentAuthorName: c.name || '',
              commentAuthorUid: c.uid || '',
              reporterUid: meUser.uid,
              reporterName: meUser.name || meUser.email || '',
              handled: false,
              created_at: firebase.firestore.FieldValue.serverTimestamp()
            }).then(function () {
              b.textContent = 'דווח ✓';
              cmsg.textContent = 'הדיווח נשלח לאוריאן. תודה.';
              setTimeout(function () { cmsg.textContent = ''; }, 4000);
            }).catch(function (e) {
              b.disabled = false;
              b.textContent = 'דיווח';
              cmsg.textContent = 'הדיווח נכשל. נסי שוב.';
              console.error(e);
            });
          });
        });
      }

      // מאזין חי · תגובה חדשה מופיעה לכולן בלי רענון
      db.collection('comments').where('stationId', '==', station.id)
        .onSnapshot(function (snap) {
          var items = snap.docs.map(function (d) { var o = d.data(); o.id = d.id; return o; });
          items.sort(function (a, b) {
            var ta = a.created_at && a.created_at.toMillis ? a.created_at.toMillis() : 0;
            var tb = b.created_at && b.created_at.toMillis ? b.created_at.toMillis() : 0;
            return tb - ta;
          });
          draw(items);
        }, function (e) {
          list.innerHTML = '<div class="cempty">לא הצלחנו לטעון את התגובות.</div>';
          console.error('[comments]', e);
        });

      post.addEventListener('click', function () {
        var body = (area.value || '').trim();
        if (body.length < 2) { cmsg.textContent = 'כתבי משהו קצר לפני הפרסום'; return; }
        if (body.length > 999) { cmsg.textContent = 'התגובה ארוכה מדי'; return; }
        post.disabled = true;
        cmsg.textContent = 'מפרסם...';
        db.collection('comments').add({
          stationId: station.id,
          uid: meUser.uid,
          name: meUser.name || (meUser.email || '').split('@')[0] || 'משתתפת',
          isAdmin: !!meUser.isAdmin,
          body: body,
          created_at: firebase.firestore.FieldValue.serverTimestamp()
        }).then(function () {
          area.value = '';
          cmsg.textContent = 'פורסם ✓';
          setTimeout(function () { cmsg.textContent = ''; }, 2000);
        }).catch(function (e) {
          cmsg.textContent = 'הפרסום נכשל. נסי שוב.';
          console.error(e);
        }).then(function () { post.disabled = false; });
      });
    })();
  })();
  </script>
  <script src="js/theme.js"></script>
  <script src="js/ai-tutor.js"></script>
</body>
</html>
