<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הדרך ל-50K</title>
<link rel="stylesheet" href="css/portal.css">
<link rel="stylesheet" href="css/journey-theme.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Heebo:wght@400;500;600;700;800&display=swap">
<script src="js/icons.js"></script>
<style>
  /* ============================================================
     מפת המסע · עיצוב ייעודי לדף הבית (נייבי כהה #010f24 + ורוד #fcc1cb)
     סקופ מקומי לדף הזה בלבד, לא נוגע בטוקנים הגלובליים של portal.css
     ============================================================ */
  :root{
    --hp-bg:#010f24;
    --hp-bg-2:#071b38;
    --hp-card:#0a1c38;
    --hp-line:rgba(252,193,203,.16);
    --hp-pink:#fcc1cb;
    --hp-pink-soft:rgba(252,193,203,.55);
    --hp-text:#eaf1fb;
    --hp-text-dim:#93a6c4;
    --hp-glow:0 0 18px rgba(252,193,203,.55), 0 0 40px rgba(252,193,203,.25);
  }
  html,body{background:var(--hp-bg) !important}
  body{padding:0 0 60px;color:var(--hp-text)}
  .theme-toggle{display:none !important}

  .wrap{max-width:1180px;margin:0 auto;padding:0 22px}
  .devbar{background:#211a0c;border:1px solid #4d3c14;color:#c9a84e;font-size:11.5px;text-align:center;padding:7px 12px}

  /* ---------- Nav ---------- */
  .hero{position:relative;text-align:center;padding:34px 18px 26px}
  .hero .side-note{position:absolute;top:38px;font-family:'Caveat',cursive;font-size:19px;line-height:1.35;color:var(--hp-pink-soft)}
  .hero .side-note.right{inset-inline-start:0;text-align:start}
  .hero .side-note.left{inset-inline-end:0;text-align:end}
  @media(max-width:900px){ .hero .side-note{display:none} }
  .hero .kick{font-size:12px;letter-spacing:4px;font-weight:700;color:var(--hp-pink);text-transform:uppercase}
  .hero h1{font-family:'Heebo',sans-serif;font-size:38px;font-weight:800;color:var(--hp-pink);margin-top:10px;letter-spacing:-.5px}
  .hero .sub{font-size:15px;color:var(--hp-text-dim);margin-top:10px;max-width:520px;margin-inline:auto}
  .hero .cta{display:inline-flex;align-items:center;gap:8px;margin-top:20px;background:var(--hp-pink);color:#2a1018;font-weight:700;font-size:14.5px;padding:13px 26px;border-radius:30px;text-decoration:none;box-shadow:var(--hp-glow);transition:.15s}
  .hero .cta:active{transform:scale(.97)}

  /* ---------- progress ---------- */
  /* באנר "המשך לצפות" בסגנון נטפליקס · בקשת אוריאן [פגישה 02:02] */
  .nextban{display:flex;gap:0;align-items:stretch;max-width:560px;margin:22px auto 0;
    background:var(--hp-card);border:1px solid var(--hp-line);border-radius:18px;overflow:hidden;
    cursor:pointer;transition:.18s;text-align:start}
  .nextban:hover{border-color:var(--hp-pink);transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .nextban .th{position:relative;flex:0 0 172px;background:#0d2242 center/cover no-repeat}
  .nextban .th .pl{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:30px;
    text-shadow:0 2px 12px rgba(0,0,0,.7)}
  .nextban .tx{flex:1;padding:15px 18px;display:flex;flex-direction:column;justify-content:center;gap:5px}
  .nextban .kick{font-size:11px;letter-spacing:2px;color:var(--hp-pink);font-weight:700}
  .nextban .nm{font-size:17px;font-weight:800;color:#eaf1fb;line-height:1.3}
  .nextban .sub2{font-size:12.5px;color:#93a6c4}
  @media(max-width:520px){
    .nextban{flex-direction:column}
    .nextban .th{flex:none;height:150px}
  }
  .progress-box{background:var(--hp-card);border:1px solid var(--hp-line);border-radius:16px;padding:15px 20px;max-width:520px;margin:24px auto 0}
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .progress-top .label{font-size:13px;color:var(--hp-text-dim);font-weight:500}
  .progress-top .val{font-size:14px;color:var(--hp-pink);font-weight:700}
  .bar{height:8px;background:rgba(255,255,255,.06);border-radius:20px;overflow:hidden}
  .bar>span{display:block;height:100%;width:0;background:var(--hp-pink);border-radius:20px;transition:width .5s}

  /* ---------- Road / journey ---------- */
  .road-section{margin-top:50px;position:relative}
  .chapter-tag{text-align:center;margin:36px 0 6px;font-size:12.5px;letter-spacing:2px;font-weight:700;color:var(--hp-text-dim);text-transform:uppercase}
  .chapter-tag b{color:var(--hp-pink)}

  .path{position:relative;padding:10px 0}
  .path svg.track{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .nodes{position:relative;z-index:1}

  .node{display:flex;flex-direction:column;align-items:center;min-height:170px;position:relative;justify-content:flex-start}
  .node.p-r{align-items:flex-start;padding-inline-start:8%}
  .node.p-l{align-items:flex-end;padding-inline-end:8%}

  .pin{width:56px;height:56px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;
    background:var(--hp-card);border:2px solid var(--hp-line);position:relative;flex-shrink:0;transition:transform .15s}
  .node:not(.locked) .pin{cursor:pointer}
  .node:not(.locked) .pin:active{transform:rotate(-45deg) scale(.94)}
  .pin .num{transform:rotate(45deg);font-size:19px;font-weight:800;color:var(--hp-text)}

  .node.done .pin{background:var(--hp-card);border-color:var(--hp-pink)}
  .node.done .pin .num{color:var(--hp-pink)}
  .node.active .pin{background:var(--hp-pink);border-color:var(--hp-pink);box-shadow:var(--hp-glow)}
  .node.active .pin .num{color:#2a1018}
  .node.locked .pin{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.08)}
  .node.locked .pin .num{color:var(--hp-text-dim)}

  .card{margin-top:14px;background:var(--hp-card);border:1px solid var(--hp-line);border-radius:14px;padding:12px 16px;max-width:220px;text-align:center}
  .node.locked .card{opacity:.55}
  .card .ic-box{width:34px;height:34px;border-radius:9px;background:rgba(252,193,203,.1);color:var(--hp-pink);display:grid;place-items:center;margin:0 auto 8px}
  .card .t{font-size:14px;font-weight:700;color:var(--hp-text)}
  .card .m{font-size:11.5px;color:var(--hp-text-dim);margin-top:3px}

  .start-flag,.end-flag{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--hp-pink);margin-bottom:8px}
  .start-flag .box,.end-flag .box{padding:6px 16px;border:1px solid var(--hp-line);border-radius:8px;background:var(--hp-card);letter-spacing:2px}
  .end-flag .star{font-size:26px}

  .goal{text-align:center;margin-top:40px;padding:28px 18px;background:var(--hp-card);border:1px solid var(--hp-line);border-radius:18px;max-width:520px;margin-inline:auto}
  .goal .ring{width:64px;height:64px;border-radius:50%;background:var(--hp-pink);color:#2a1018;font-weight:800;font-size:16px;display:grid;place-items:center;margin:0 auto 10px;box-shadow:var(--hp-glow)}
  .goal .gt{font-size:18px;font-weight:800;color:var(--hp-pink)}
  .goal .gs{font-size:13px;color:var(--hp-text-dim);margin-top:5px}

  /* ---------- footer ---------- */
  .credit{text-align:center;color:var(--hp-text-dim);font-size:12px;margin-top:44px}
  .tagline{display:flex;align-items:center;gap:14px;justify-content:center;color:var(--hp-text-dim);font-size:11.5px;letter-spacing:2px;text-transform:uppercase;margin-top:50px}
  .tagline::before,.tagline::after{content:"";width:60px;height:1px;background:var(--hp-line)}
</style>
<!-- שער כניסה · חייב להיטען לפני שאר סקריפטי הדף -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/gate.js"></script>
<script src="js/nav.js"></script>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <h1>The Road to 50K</h1>
    <div class="sub">כל הפרקים, הכלים והליווי במקום אחד.</div>
    <div class="progress-box">
      <div class="progress-top">
        <span class="label">ההתקדמות שלך</span>
        <span class="val" id="pval">…</span>
      </div>
      <div class="bar"><span id="pfill"></span></div>
    </div>

    <div class="nextban" id="nextBan" style="display:none">
      <div class="th" id="nbThumb"><span class="pl">▶</span></div>
      <div class="tx">
        <span class="kick" id="nbKick">המשך לאן שהפסקת</span>
        <span class="nm" id="nbName"></span>
        <span class="sub2" id="nbSub"></span>
      </div>
    </div>
    <a class="cta" href="#" id="ctaContinue" style="display:none">המשך לאן שהפסקת →</a>
  </div>

  <div class="road-section" id="journey"></div>

  <div class="goal">
    <div class="ring">50K</div>
    <div class="gt">היעד · 50,000 ₪ בחודש</div>
    <div class="gs" id="goalSub">…</div>
  </div>

  <div class="credit">נבנה ע"י <b>הלל אקנין</b></div>
</div>

<script src="data/content.js"></script>
<script>
  const KEY = 'oriane_journey_progress';
  const CH = window.COURSE.chapters;
  const TOTAL = window.COURSE.totalStations;
  let done = +(localStorage.getItem(KEY) || 3);
  done = Math.max(0, Math.min(TOTAL, done));

  function go(n){ location.href = 'station.html?id=' + n; }

  // בונה נתיב SVG מתעקל בין מרכזי הצמתים בפרק
  function buildTrack(positions){
    const NH = 170, xOf = p => p === 'r' ? 18 : 82;
    let d = '', h = positions.length * NH;
    positions.forEach((p, i) => {
      const x = xOf(p), y = i * NH + 60;
      if (i === 0) d = `M ${x} ${y}`;
      else {
        const px = xOf(positions[i-1]), my = ((i-1)*NH + 60 + y) / 2;
        d += ` C ${px} ${my}, ${x} ${my}, ${x} ${y}`;
      }
    });
    return { d, h };
  }

  function render(){
    const root = document.getElementById('journey');
    root.innerHTML = '';
    let gi = 0; // אינדקס גלובלי לזיג-זג רציף
    const lastStationId = CH[CH.length - 1].stations[CH[CH.length - 1].stations.length - 1].id;

    CH.forEach((ch, ci) => {
      const tag = document.createElement('div');
      tag.className = 'chapter-tag';
      tag.innerHTML = `פרק ${ci+1} · <b>${ch.title}</b> · יעד ${(ch.goal/1000)}K`;
      root.appendChild(tag);

      const positions = ch.stations.map((_, i) => ((gi + i) % 2 === 0) ? 'r' : 'l');
      const { d, h } = buildTrack(positions);
      const path = document.createElement('div');
      path.className = 'path';
      path.style.height = h + 'px';
      path.innerHTML = `<svg class="track" viewBox="0 0 100 ${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--hp-line)" stroke-width="0.6" stroke-dasharray="2.5 2.5" stroke-linecap="round"/></svg>`;
      const nodes = document.createElement('div');
      nodes.className = 'nodes';

      ch.stations.forEach((s, i) => {
        const pos = positions[i];
        const state = s.id <= done ? 'done' : (s.id === done + 1 ? 'active' : 'locked');
        const node = document.createElement('div');
        node.className = `node ${state} p-${pos}`;

        let flag = '';
        if (s.id === 1) flag = '<div class="start-flag"><div class="box">START</div></div>';
        if (s.id === lastStationId) flag = '<div class="end-flag"><span class="star">★</span></div>';

        node.innerHTML = `
          ${flag}
          <div class="pin"><div class="num">${s.id}</div></div>
          <div class="card">
            <div class="ic-box"><span data-ic="${state==='locked' ? 'lock' : 'target'}" style="width:16px;height:16px"></span></div>
            <div class="t">פרק ${s.id} · ${s.name}</div>
            <div class="m">${state === 'active' ? 'התחנה הפעילה שלך' : (state === 'done' ? 'הושלם' : 'נעול')}</div>
          </div>`;
        if (state !== 'locked') node.onclick = () => go(s.id);
        nodes.appendChild(node);
      });

      path.appendChild(nodes);
      root.appendChild(path);
      gi += ch.stations.length;
    });
    updateProgress();
  }

  function updateProgress(){
    document.getElementById('pval').textContent = `${done} / ${TOTAL} הושלמו`;
    document.getElementById('pfill').style.width = (done / TOTAL * 100) + '%';
    const left = TOTAL - done;
    document.getElementById('goalSub').textContent = left > 0 ? `עוד ${left} תחנות והגעת לפסגה` : 'הגעת לפסגה · 50K';
    const nextId = Math.min(done + 1, TOTAL);
    document.getElementById('ctaContinue').href = 'station.html?id=' + nextId;

    // ---------- באנר "המשך לצפות" ----------
    // מציג את השיעור הבא עם התמונה הממוזערת שלו מיוטיוב.
    // אם אין וידאו לתחנה הבאה, נופל חזרה לכפתור הטקסטואלי.
    (function () {
      var all = (window.COURSE && window.COURSE.allStations) || [];
      var next = all.filter(function (s) { return s.id === nextId; })[0];
      var ban = document.getElementById('nextBan');
      var cta = document.getElementById('ctaContinue');
      if (!next || !ban) return;

      var yt = next.youtubeId;
      var label = next.name, sub = next.tier || '';
      var href = 'station.html?id=' + next.id;

      // אם לתחנה יש שיעורים, מצביעים על השיעור הראשון שלה
      if (next.lessons && next.lessons.length) {
        yt = next.lessons[0].youtubeId || yt;
        label = next.lessons[0].n || label;
        sub = next.name + ' · ' + next.lessons.length + ' שיעורים';
        href += '&l=1';
      }
      if (!yt) { cta.style.display = ''; return; }   // אין וידאו — נשארים עם הכפתור

      document.getElementById('nbThumb').style.backgroundImage =
        'url(https://i.ytimg.com/vi/' + encodeURIComponent(yt) + '/mqdefault.jpg)';
      document.getElementById('nbKick').textContent = done ? 'המשך לאן שהפסקת' : 'מתחילים כאן';
      document.getElementById('nbName').textContent = label;
      document.getElementById('nbSub').textContent = sub;
      ban.style.display = '';
      ban.addEventListener('click', function () { location.href = href; });
    })();
    // כרטיס "הקורס שלי" הוסר בבקשת אוריאן [פגישה 07.09, 20:02].
    // נשמרת בדיקת קיום כדי שהסרת אלמנט לא תפיל את כל הסקריפט.
    var fc = document.getElementById('featCourse');
    if (fc) fc.href = 'station.html?id=' + nextId;
  }

  render();
</script>
<script src="js/ai-tutor.js"></script>
</body>
</html>
