<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>הדרך ל-50K</title>
<link rel="stylesheet" href="css/portal.css">
<link rel="stylesheet" href="css/journey-theme.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Heebo:wght@400;500;600;700;800&display=swap">
<script src="js/icons.js"></script>
<style>
  /* ============================================================
     מפת המסע · עיצוב ייעודי לדף הבית (נייבי כהה #010f24 + ורוד #fcc1cb)
     סקופ מקומי לדף הזה בלבד, לא נוגע בטוקנים הגלובליים של portal.css
     ============================================================ */
  :root{
    --hp-bg:#010f24;
    --hp-bg-2:#071b38;
    --hp-card:#0a1c38;
    --hp-line:rgba(252,193,203,.16);
    --hp-pink:#fcc1cb;
    --hp-pink-soft:rgba(252,193,203,.55);
    --hp-text:#eaf1fb;
    --hp-text-dim:#93a6c4;
    --hp-glow:0 0 18px rgba(252,193,203,.55), 0 0 40px rgba(252,193,203,.25);
  }
  html,body{background:var(--hp-bg) !important}
  body{padding:0 0 60px;color:var(--hp-text)}
  .theme-toggle{display:none !important}

  .wrap{max-width:1180px;margin:0 auto;padding:0 22px}
  .devbar{background:#211a0c;border:1px solid #4d3c14;color:#c9a84e;font-size:11.5px;text-align:center;padding:7px 12px}

  /* ---------- Hero banner (תמונה) ---------- */
  /* באנר עליון עם התמונה שסיפקה אוריאן (Dream·Plan·Build·Scale).
     הטקסט הראשי כבר "אפוי" בתוך התמונה עצמה, כך שכאן רק מוסיפים
     שכבת הצללה עדינה לקריאות + כפתור CTA שמוביל לתחנה הבאה בהתקדמות.
     בקשת אוריאן 10.09. */
  .hero-banner{position:relative;border-radius:20px;overflow:hidden;margin-top:8px;
    box-shadow:0 10px 34px rgba(0,0,0,.4)}
  .hero-banner .hb-img{display:block;width:100%;height:auto;aspect-ratio:2.55/1;object-fit:cover;object-position:center 32%}
  @media(max-width:700px){
    .hero-banner .hb-img{aspect-ratio:1.7/1;object-position:center 30%}
  }
  .hero-banner .hb-fade{position:absolute;inset:0;
    background:linear-gradient(0deg, rgba(1,15,36,.85) 0%, rgba(1,15,36,.15) 38%, transparent 60%)}
  .hero-banner .hb-content{position:absolute;left:0;right:0;bottom:0;padding:18px 26px 24px;
    display:flex;flex-direction:column;align-items:center;gap:14px}
  .hero-banner .hb-cta{display:inline-flex;align-items:center;gap:8px;background:var(--hp-pink);
    color:#2a1018;font-weight:700;font-size:14px;padding:12px 24px;border-radius:30px;
    text-decoration:none;box-shadow:var(--hp-glow);transition:.15s;white-space:nowrap}
  .hero-banner .hb-cta:active{transform:scale(.97)}
  @media(max-width:700px){
    .hero-banner .hb-content{padding:14px 16px 18px}
    .hero-banner .hb-cta{font-size:13px;padding:10px 20px}
  }

  /* ---------- Nav ---------- */
  .hero{position:relative;text-align:center;padding:20px 18px 26px}
  .hero .side-note{position:absolute;top:38px;font-family:'Caveat',cursive;font-size:19px;line-height:1.35;color:var(--hp-pink-soft)}
  .hero .side-note.right{inset-inline-start:0;text-align:start}
  .hero .side-note.left{inset-inline-end:0;text-align:end}
  @media(max-width:900px){ .hero .side-note{display:none} }
  .hero .kick{font-size:12px;letter-spacing:4px;font-weight:700;color:var(--hp-pink);text-transform:uppercase}
  .hero h1{font-family:'Heebo',sans-serif;font-size:38px;font-weight:800;color:var(--hp-pink);margin-top:10px;letter-spacing:-.5px}
  .hero .sub{font-size:15px;color:var(--hp-text-dim);margin-top:10px;max-width:520px;margin-inline:auto}
  .hero .cta{display:inline-flex;align-items:center;gap:8px;margin-top:20px;background:var(--hp-pink);color:#2a1018;font-weight:700;font-size:14.5px;padding:13px 26px;border-radius:30px;text-decoration:none;box-shadow:var(--hp-glow);transition:.15s}
  .hero .cta:active{transform:scale(.97)}

  /* ---------- progress ---------- */
  /* באנר "המשך לצפות" בסגנון נטפליקס · בקשת אוריאן [פגישה 02:02] */
  .nextban{display:flex;gap:0;align-items:stretch;max-width:560px;margin:22px auto 0;
    background:var(--hp-card);border:1px solid var(--hp-line);border-radius:18px;overflow:hidden;
    cursor:pointer;transition:.18s;text-align:start}
  .nextban:hover{border-color:var(--hp-pink);transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .nextban .th{position:relative;flex:0 0 172px;background:#0d2242 center/cover no-repeat}
  .nextban .th .pl{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:30px;
    text-shadow:0 2px 12px rgba(0,0,0,.7)}
  .nextban .tx{flex:1;padding:15px 18px;display:flex;flex-direction:column;justify-content:center;gap:5px}
  .nextban .kick{font-size:11px;letter-spacing:2px;color:var(--hp-pink);font-weight:700}
  .nextban .nm{font-size:17px;font-weight:800;color:#eaf1fb;line-height:1.3}
  .nextban .sub2{font-size:12.5px;color:#93a6c4}
  @media(max-width:520px){
    .nextban{flex-direction:column}
    .nextban .th{flex:none;height:150px}
  }
  /* ---------- progress-box · overlay שקוף על תמונת הבאנר (בקשת אוריאן 16.09) ----------
     במקום widget צף שרחף על כל הדף, ההתקדמות עכשיו "יושבת" בפינה
     הימנית-עליונה של תמונת הבאנר עצמה, עם רקע זכוכית שקוף שמתערבב
     בתמונה במקום להסתיר אותה. */
  .progress-box{position:absolute;top:16px;right:16px;z-index:2;
    background:rgba(1,15,36,.45);border:1px solid rgba(255,255,255,.18);border-radius:14px;
    padding:10px 14px;width:158px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}
  .progress-top .label{font-size:11px;color:#dbe6f7;font-weight:500;white-space:nowrap}
  .progress-top .val{font-size:11.5px;color:var(--hp-pink);font-weight:700;white-space:nowrap}
  .bar{height:6px;background:rgba(255,255,255,.18);border-radius:20px;overflow:hidden}
  .bar>span{display:block;height:100%;width:0;background:var(--hp-pink);border-radius:20px;transition:width .5s}
  @media(max-width:520px){
    .progress-box{width:118px;padding:7px 10px;top:10px;right:10px}
    .progress-top .label{font-size:9px}
    .progress-top .val{font-size:9.5px}
  }

  /* ---------- Road / journey ---------- */
  .road-section{margin-top:50px;position:relative}
  .chapter-tag{position:relative;z-index:1;text-align:center;margin:36px 0 6px;font-size:12.5px;letter-spacing:2px;font-weight:700;color:var(--hp-text-dim);text-transform:uppercase}
  .chapter-tag b{color:var(--hp-pink)}

  /* ---------- כפתור הפתיח · בקשת אוריאן 15.09 (הקלטה קולית) ----------
     "כפתור ירוק פליי ממש לפני הקובייה אחת, שזה יהיה באמצע, ומשם הקו
      המקווקו יתחיל. ואז ההתחלה תהיה שם, אנשים ילחצו, ומשם הם יעברו
      לפרק אחד."
     הכפתור הוא נקודת ההתחלה הוויזואלית של המסע: drawTrackAndFinish
     מוסיף את מרכזו כנקודה הראשונה בנתיב, ולכן הקו המקווקו יוצא ממנו
     ולא מתחנה 1. הוא בזרימה רגילה וממורכז, ולכן לא נוגע בסדר התחנות
     ולא שובר את המפה במובייל. */
  .start-play{position:relative;z-index:1;display:flex;flex-direction:column;
    align-items:center;gap:9px;margin:0 0 4px}
  .sp-btn{width:66px;height:66px;border-radius:50%;border:0;cursor:pointer;
    display:grid;place-items:center;background:linear-gradient(160deg,#34d977,#16a34a);
    box-shadow:0 8px 22px rgba(22,163,74,.45);transition:transform .15s,box-shadow .15s}
  .sp-btn:hover{transform:scale(1.06);box-shadow:0 10px 28px rgba(22,163,74,.60)}
  .sp-btn:active{transform:scale(.95)}
  .sp-btn svg{width:25px;height:25px;margin-inline-start:4px}
  /* שבב רקע · הקו המקווקו יוצא מהכפתור ועובר בדיוק דרך הכיתוב.
     אותה תבנית של .fm-txt בסמן הסיום, כדי שהטקסט יישאר קריא. */
  .sp-txt{font-size:12.5px;font-weight:800;color:#8ef0b4;letter-spacing:.4px;
    background:var(--hp-card);padding:5px 14px;border-radius:20px;
    border:1px solid rgba(52,217,119,.30);white-space:nowrap}
  @media(max-width:520px){ .sp-btn{width:58px;height:58px} .sp-btn svg{width:21px;height:21px}
    .sp-txt{font-size:11.5px;padding:4px 12px} }

  /* מודאל הפתיח · נבחר על פני דף ייעודי כדי לא להוסיף מסלול חדש ולא
     לגעת בסדר התחנות. הצופה נשאר על המפה וממשיך משם לתחנה 1.
     ⚠️ ה-src מתרוקן בסגירה, אחרת היוטיוב ממשיך להשמיע ברקע. */
  .vm{position:fixed;inset:0;z-index:90;display:none;place-items:center;padding:16px;
    background:rgba(1,8,20,.88)}
  .vm.on{display:grid}
  .vm-box{width:min(900px,100%);max-height:92vh;overflow:auto;background:#0f2141;
    border:1px solid var(--hp-line);border-radius:16px}
  .vm-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
  .vm-head h3{font-size:14.5px;font-weight:800;color:#eaf1fb}
  .vm-x{background:none;border:0;color:var(--hp-text-dim);font-size:26px;line-height:1;
    cursor:pointer;padding:0 6px}
  .vm-x:hover{color:#fff}
  .vm-video{position:relative;width:100%;aspect-ratio:16/9;background:#000}
  .vm-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .vm-foot{padding:14px 16px 16px;text-align:center}
  .vm-next{display:inline-flex;align-items:center;gap:7px;background:var(--hp-pink);
    color:#2a1018;font-weight:700;font-size:13.5px;padding:11px 22px;border-radius:24px;
    text-decoration:none}

  /* מסלול רציף אחד לכל המסע (מצויר לפי מיקום אמיתי של הפינים בדום,
     לא לפי הערכה מראש) · בקשת אוריאן 10.09: הקו נמחק בין מדרגה 2 ל-3
     כי כל מדרגה ציירה נתיב נפרד. עכשיו יש רק SVG אחד שרץ ברצף על פני
     כל התחנות, כולל האזור שבין המדרגות, ולכן הוא לעולם לא נעלם. */
  .track-all{position:absolute;top:0;left:0;width:100%;z-index:0;pointer-events:none}

  .nodes{position:relative;z-index:1}
  .node{display:flex;flex-direction:column;align-items:center;min-height:302px;position:relative;justify-content:flex-start}
  .node.p-r{align-items:flex-start;padding-inline-start:8%}
  .node.p-l{align-items:flex-end;padding-inline-end:8%}

  /* סמן הסיום · בית + דגל, אחרי התחנה האחרונה. בקשת אוריאן 10.09. */
  .finish-marker{position:absolute;transform:translate(-50%,-46%);display:flex;flex-direction:column;
    align-items:center;gap:6px;z-index:1}
  .finish-marker .fm-icons{display:flex;align-items:flex-end;gap:2px;font-size:36px;line-height:1;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
  .finish-marker .fm-txt{font-size:11.5px;font-weight:800;color:var(--hp-pink);background:var(--hp-card);
    padding:5px 14px;border-radius:20px;border:1px solid var(--hp-line);white-space:nowrap}

  .pin{width:56px;height:56px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;
    background:var(--hp-card);border:2px solid var(--hp-line);position:relative;flex-shrink:0;transition:transform .15s}
  .node:not(.locked):not(.empty) .pin{cursor:pointer}
  .node:not(.locked):not(.empty) .pin:active{transform:rotate(-45deg) scale(.94)}
  .pin .num{transform:rotate(45deg);font-size:19px;font-weight:800;color:var(--hp-text)}

  .node.done .pin{background:var(--hp-card);border-color:var(--hp-pink)}
  .node.done .pin .num{color:var(--hp-pink)}
  .node.active .pin{background:var(--hp-pink);border-color:var(--hp-pink);box-shadow:var(--hp-glow)}
  .node.active .pin .num{color:#2a1018}
  /* אטום לגמרי בכל מצב · פין עם רקע שקוף היה מאפשר לקו הצהוב להיראות
     מבעד לו ולהסתיר את המספר (בקשת אוריאן 10.09). */
  .node.locked .pin{background:#11233e;border-color:rgba(255,255,255,.16)}
  .node.locked .pin .num{color:var(--hp-text-dim)}
  /* תחנה ריקה (אין וידאו/שיעורים) · פין בגוון ורוד-כהה אטום, לא לחיץ */
  .node.empty .pin{background:#363a52;border-color:var(--hp-pink)}
  .node.empty .pin .num{color:var(--hp-pink)}

  /* דמות "היא" · עומדת תמיד מימין למספר של התחנה הנוכחית בהתקדמות,
     ומחזיקה שק זהב אחד צמוד ללב (לא מצטבר בין תחנה לתחנה, בקשת אוריאן 10.09). */
  .pin-wrap{position:relative;display:inline-flex}
  .walker{position:absolute;top:50%;left:100%;transform:translateY(-50%);margin-left:6px;
    display:flex;flex-direction:column;align-items:center;z-index:3;pointer-events:none}
  .walker svg{width:30px;height:42px;filter:drop-shadow(0 3px 7px rgba(0,0,0,.5))}
  @media(max-width:520px){ .walker svg{width:24px;height:34px} }

  /* כרטיס התחנה · רקע ורוד-בהיר עדין עם ניגודיות ברורה מול הרקע הכהה
     (בקשת אוריאן 10.09: הכרטיסים "נבלעו" ברקע). מסגרת ורודה בולטת יותר
     וצל עדין שמפריד אותם חזותית מהעמוד. אותו מראה חל על כל הקוביות,
     כולל תחנות ריקות · הן מסומנות רק ע"י תג המנעול הצהוב, לא ע"י כרטיס דהוי. */
  .card{margin-top:14px;border-radius:14px;padding:12px 16px;max-width:220px;text-align:center;
    background:linear-gradient(160deg, rgba(252,193,203,.20), rgba(252,193,203,.05) 65%), #0f2141;
    border:1px solid rgba(252,193,203,.38);
    box-shadow:0 6px 20px rgba(0,0,0,.28);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease}
  .node:not(.locked):not(.empty) .card{cursor:pointer}
  .node:not(.locked):not(.empty):hover .card{transform:translateY(-3px);border-color:var(--hp-pink);
    box-shadow:0 10px 28px rgba(252,193,203,.2)}
  .node.active .card{border-color:var(--hp-pink);box-shadow:0 0 0 1px var(--hp-pink), 0 10px 26px rgba(252,193,203,.22)}
  /* נעול לפי מתג ההתקדמות (כרגע כבוי) · היחיד שנשאר מרוכך, כי הוא מייצג
     חסימה זמנית ולא חוסר תוכן קבוע. */
  .node.locked .card{opacity:.62;background:#0d1b30;border-color:rgba(255,255,255,.1);box-shadow:none}
  .card .ic-box{width:34px;height:34px;border-radius:9px;background:rgba(252,193,203,.14);color:var(--hp-pink);display:grid;place-items:center;margin:0 auto 8px}
  .card .t{font-size:14px;font-weight:700;color:var(--hp-text)}
  .card .m{font-size:11.5px;color:var(--hp-text-dim);margin-top:3px}
  /* תיאור קצר על הכרטיס · בקשת הלל 09.09.
     נחתך לשתי שורות כדי שגובה הכרטיס יישאר צפוי, אחרת הכרטיסים גולשים
     מהמסלול ומתנגשים. הטקסט המלא מוצג במסך התחנה. */
  .card .cdesc{font-size:11.5px;line-height:1.5;color:var(--hp-text-dim);margin-top:6px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* מונה שיעורים בקובייה · בקשת אוריאן 08.09 */
  .card .lcount{display:inline-block;font-size:11px;font-weight:700;margin-top:7px;
    padding:3px 9px;border-radius:30px;color:var(--hp-text-dim);
    background:rgba(127,127,127,.14)}
  .card .lcount.full{color:#fff;background:#C2456A}
  /* סימון תוכן · בקשת אוריאן 09.09: לראות במבט אחד איפה כבר יש חומר.
     משתמש רק בפלטה הקיימת של הדף (ורוד המותג + קו המתאר הקיים). */
  .card .lcount.ready{color:var(--hp-pink);background:rgba(252,193,203,.14)}
  /* תווית "נעול" צהובה · בקשת אוריאן 10.09: תחנה בלי שום תוכן לא לחיצה,
     ומסומנת ככפתור נעול צהוב במקום פשוט "עדיין ריק". פלטת הצהוב זהה
     ל-devbar הקיים כבר בקוד, כדי לא להמציא צבע אזהרה נוסף. */
  .card .lockbtn{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;margin-top:7px;
    padding:4px 11px;border-radius:30px;color:#e8c97a;background:#3a2d12;border:1px solid #7a5c1e}
  .card .lockbtn svg{width:11px;height:11px;flex:none}
  /* המספרים בתוך התווית נשארים בכיוון שלהם ולא מתהפכים ב-RTL */
  .card .lcount .n{unicode-bidi:isolate}

  .start-flag,.end-flag{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--hp-pink);margin-bottom:8px}
  .start-flag .box,.end-flag .box{padding:6px 16px;border:1px solid var(--hp-line);border-radius:8px;background:var(--hp-card);letter-spacing:2px}
  .end-flag .star{font-size:26px}

  /* קופסת היעד · אותה ערכת עיצוב כמו הכרטיסים (גרדיאנט ורוד-בהיר +
     מסגרת בולטת + צל), כדי שהיא "תסתנכרן" חזותית עם שאר המסע. בקשת אוריאן 10.09. */
  .goal{text-align:center;margin-top:56px;padding:30px 20px;border-radius:18px;max-width:520px;margin-inline:auto;
    background:linear-gradient(160deg, rgba(252,193,203,.20), rgba(252,193,203,.05) 65%), #0f2141;
    border:1px solid rgba(252,193,203,.38);
    box-shadow:0 6px 20px rgba(0,0,0,.28)}
  .goal .ring{width:64px;height:64px;border-radius:50%;background:var(--hp-pink);color:#2a1018;font-weight:800;font-size:16px;display:grid;place-items:center;margin:0 auto 10px;box-shadow:var(--hp-glow)}
  .goal .gt{font-size:18px;font-weight:800;color:var(--hp-pink)}
  .goal .gs{font-size:13px;color:var(--hp-text-dim);margin-top:5px}

  /* ---------- footer ---------- */
  .credit{text-align:center;color:var(--hp-text-dim);font-size:12px;margin-top:44px}
  .tagline{display:flex;align-items:center;gap:14px;justify-content:center;color:var(--hp-text-dim);font-size:11.5px;letter-spacing:2px;text-transform:uppercase;margin-top:50px}
  .tagline::before,.tagline::after{content:"";width:60px;height:1px;background:var(--hp-line)}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>

</head>
<body>

<div class="wrap">
  <div class="hero-banner">
    <img class="hb-img" src="img/hero-banner.jpg" alt="המסע ל-50K בחודש · Dream Plan Build Scale">
    <div class="hb-fade"></div>
    <div class="hb-content">
      <a class="hb-cta" href="#" id="ctaContinue">המשך מהמקום שעצרתי →</a>
    </div>
    <!-- ווידג'ט התקדמות · שוכב עם רקע שקוף מעל תמונת הבאנר (בקשת אוריאן 16.09) -->
    <div class="progress-box" id="progressBox">
      <div class="progress-top">
        <span class="label">ההתקדמות שלך</span>
        <span class="val" id="pval">…</span>
      </div>
      <div class="bar"><span id="pfill"></span></div>
    </div>
  </div>

  <div class="hero">
    <div class="nextban" id="nextBan" style="display:none">
      <div class="th" id="nbThumb"><span class="pl">▶</span></div>
      <div class="tx">
        <span class="kick" id="nbKick">המשך לאן שהפסקת</span>
        <span class="nm" id="nbName"></span>
        <span class="sub2" id="nbSub"></span>
      </div>
    </div>
  </div>

  <div class="road-section" id="journey"></div>

  <div class="goal">
    <div class="ring">50K</div>
    <div class="gt">היעד · 50,000 ₪ בחודש</div>
    <div class="gs" id="goalSub">…</div>
  </div>

  <div class="credit">נבנה ע"י <b>הלל אקנין</b></div>
</div>

<script src="data/content.js"></script>
<script src="js/lesson-progress.js"></script>
<script>
  /* ============================================================
     נעילת ההתקדמות · כבויה זמנית לקראת ההשקה (החלטת הלל 09.09.2026)
     false = כל התחנות פתוחות וניתנות ללחיצה.
     true  = חוזרים לנעילה הסדרתית, תחנה נפתחת רק אחרי שקודמתה הסתיימה.
     ⚠️ זו המילה היחידה שצריך להחליף כדי להחזיר את הנעילה אחרי ההשקה.
        אותו קבוע קיים גם ב-station.html ושניהם חייבים להיות זהים.
     ============================================================ */
  const PROGRESS_LOCK_ENABLED = false;

  const KEY = 'oriane_journey_progress';
  const CH = window.COURSE.chapters;
  const TOTAL = window.COURSE.totalStations;

  /* ברירת המחדל היא 0 ולא 3.
     קודם היא סימנה שלוש תחנות כ"הושלם" למי שלא צפתה בכלום,
     ושניים מהם בכלל ריקים מווידאו. */
  /* נקרא דרך OrianeLessons ולא ישירות מ-localStorage, כי מ-26.09
     ההתקדמות מסונכרנת מול השרת והמודול הוא המקור היחיד. */
  let done = window.OrianeLessons ? window.OrianeLessons.stationDone() : +(localStorage.getItem(KEY) || 0);
  done = Math.max(0, Math.min(TOTAL, done));

  /* האם בתחנה יש בכלל חומר · לפי מה שקיים באמת ב-data/content.js,
     גם סרטון בודד וגם מערך שיעורים. */
  function stationHasContent(s){
    return !!s.youtubeId || (Array.isArray(s.lessons) && s.lessons.length > 0);
  }

  /* "הושלם" נקבע אך ורק ממה שקרה בפועל:
     או שהתחנה סומנה בכפתור "סיום תחנה", או שכל שיעוריה נצפו.
     תחנה ריקה לעולם לא תיחשב הושלמה. */
  function stationDone(s){
    if (s.id <= done) return true;
    const n = Array.isArray(s.lessons) ? s.lessons.length : 0;
    if (n && window.OrianeLessons) return window.OrianeLessons.watchedCount(s.id) >= n;
    return false;
  }

  /* התחנה הבאה לעבוד עליה · מעדיפה את הראשונה שיש בה תוכן ולא הושלמה,
     כדי שהבאנר העליון יוביל לחומר אמיתי ולא לתחנה ריקה. */
  function firstOpenStationId(){
    const all = window.COURSE.allStations;
    const ready = all.filter(s => stationHasContent(s) && !stationDone(s));
    if (ready.length) return ready[0].id;
    const rest = all.filter(s => !stationDone(s));
    return rest.length ? rest[0].id : TOTAL;
  }

  let nextId = firstOpenStationId();

  function go(n){ location.href = 'station.html?id=' + n; }

  // מצייר נתיב SVG רציף אחד לכל המסע, לפי מיקום אמיתי של כל פין בדום
  // (ולא לפי הערכה מראש) · פותר גם את הפער שנוצר בין מדרגה למדרגה
  // וגם את חוסר הדיוק בכל תחנה. רץ אחרי שהדום כבר מוצב, ומצטרף
  // מחדש בכל שינוי גודל חלון.
  function drawTrackAndFinish(root, pinEls){
    const rootRect = root.getBoundingClientRect();
    const pts = pinEls.map(function (el) {
      const r = el.getBoundingClientRect();
      return { x: r.left + r.width / 2 - rootRect.left, y: r.top + r.height / 2 - rootRect.top };
    });
    if (!pts.length) return;

    // כפתור הפתיח הוא הנקודה הראשונה במסלול · הקו המקווקו יוצא ממנו
    // ולא מתחנה 1 (בקשת אוריאן 15.09). אם אין פתיח, המסלול מתחיל
    // מתחנה 1 בדיוק כמו קודם.
    const spBtn = root.querySelector('.sp-btn');
    if (spBtn) {
      const sr = spBtn.getBoundingClientRect();
      pts.unshift({ x: sr.left + sr.width / 2 - rootRect.left,
                    y: sr.top + sr.height / 2 - rootRect.top });
    }

    const last = pts[pts.length - 1];
    const finishY = last.y + 190;
    const finishX = last.x;
    const allPts = pts.concat([{ x: finishX, y: finishY }]);

    let d = '';
    allPts.forEach(function (p, i) {
      if (i === 0) { d = `M ${p.x} ${p.y}`; return; }
      const prev = allPts[i - 1];
      const my = (prev.y + p.y) / 2;
      d += ` C ${prev.x} ${my}, ${p.x} ${my}, ${p.x} ${p.y}`;
    });

    let svg = root.querySelector('.track-all');
    if (!svg) {
      svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'track-all');
      root.insertBefore(svg, root.firstChild);
    }
    const totalH = finishY + 80;
    svg.setAttribute('viewBox', `0 0 ${rootRect.width} ${totalH}`);
    svg.style.height = totalH + 'px';
    // קו רציף עם זוהר ניאון (לא מקווקו יותר) שממשיך את קונספט פס האור
    // מתמונת הבאנר העליון: זוהר רך מסביב + ליבה בהירה במרכז (בקשת אוריאן 16.09).
    const first = allPts[0];
    svg.innerHTML = `<defs>
        <linearGradient id="trackGrad" gradientUnits="userSpaceOnUse" x1="${first.x}" y1="${first.y}" x2="${finishX}" y2="${finishY}">
          <stop offset="0%" stop-color="#ff5fa2"/>
          <stop offset="45%" stop-color="#fcc1cb"/>
          <stop offset="100%" stop-color="#FFD54A"/>
        </linearGradient>
        <filter id="trackGlow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="5" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <path d="${d}" fill="none" stroke="url(#trackGrad)" stroke-width="9" stroke-linecap="round" opacity="0.55" filter="url(#trackGlow)"/>
      <path d="${d}" fill="none" stroke="url(#trackGrad)" stroke-opacity="0.95" stroke-width="3" stroke-linecap="round"/>
      <path d="${d}" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="1" stroke-linecap="round"/>`;

    // ---------- סמן הסיום · דגל אדום, כאילו סיימו את המסע ----------
    let finishEl = document.getElementById('finishMarker');
    if (!finishEl) {
      finishEl = document.createElement('div');
      finishEl.id = 'finishMarker';
      finishEl.className = 'finish-marker';
      finishEl.innerHTML = '<div class="fm-icons"><span>🚩</span></div><div class="fm-txt">סיימת את המסע!</div>';
      root.appendChild(finishEl);
    }
    finishEl.style.left = finishX + 'px';
    finishEl.style.top = finishY + 'px';

    root.style.minHeight = (totalH + 40) + 'px';
  }

  function render(){
    const root = document.getElementById('journey');
    root.innerHTML = '';

    /* כפתור הפתיח · ממורכז, ממש לפני תחנה 1. מוזרק רק אם יש מזהה
       ב-content.js, כך שהמפה לא נשברת אם הפתיח יוסר. */
    const introId = (window.COURSE.brand && window.COURSE.brand.introYoutubeId) || '';
    if (introId) {
      const sp = document.createElement('div');
      sp.className = 'start-play';
      sp.innerHTML =
        '<button class="sp-btn" id="spBtn" aria-label="נגן את סרטון הפתיח">' +
          '<svg viewBox="0 0 24 24" fill="#04240f" aria-hidden="true"><path d="M8 5.2v13.6L19 12z"/></svg>' +
        '</button>' +
        '<span class="sp-txt">' +
          ((window.COURSE.brand && window.COURSE.brand.introTitle) || 'צפי בפתיח') +
        '</span>';
      root.appendChild(sp);
    }

    let gi = 0; // אינדקס גלובלי לזיג-זג רציף
    const lastStationId = CH[CH.length - 1].stations[CH[CH.length - 1].stations.length - 1].id;
    const pinEls = []; // אוסף את כל אלמנטי ה-pin-wrap, לפי סדר התחנות, לציור המסלול

    // מספר התחנות שהושלמו בפועל · מוצג בטולטיפ של הדמות בלבד
    const doneCountForWalker = window.COURSE.allStations.filter(stationDone).length;
    // דמות מיוצרת פעם אחת ומוצבת ליד פין התחנה הנוכחית בהתקדמות.
    // מחזיקה שק זהב אחד צמוד ללב · לא מצטבר בין תחנה לתחנה (בקשת אוריאן 10.09).
    const walkerSvg =
      '<svg viewBox="0 0 24 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
        '<circle cx="12" cy="6" r="4.6" fill="#fff"/>' +
        '<path d="M6.5 14.5c0-2.1 2.2-3.2 5.5-3.2s5.5 1.1 5.5 3.2l1.8 13.2H4.7Z" fill="#fff"/>' +
        '<path d="M9 27.7 7 38M15 27.7l2 10.3" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>' +
        '<circle cx="12" cy="17.5" r="3.2" fill="#e8c97a" stroke="#8a6a1e" stroke-width="0.6"/>' +
        '<path d="M10.4 15.7c0-1 .7-1.6 1.6-1.6s1.6.6 1.6 1.6" fill="none" stroke="#8a6a1e" stroke-width="0.6" stroke-linecap="round"/>' +
      '</svg>';
    const walkerHtml = `<div class="walker" title="ההתקדמות שלך · ${doneCountForWalker} תחנות מאחורייך">${walkerSvg}</div>`;

    CH.forEach((ch, ci) => {
      const tag = document.createElement('div');
      tag.className = 'chapter-tag';
      // ⚠️ זו הכותרת של הקבוצה (3 מדרגות ההכנסה), לא של תחנה בודדת.
      // אסור לקרוא לה "תחנה" כי אז "תחנה 1 · הבסיס" ו"תחנה 1 · תודעה
      // ומיינדסט" יופיעו על אותו מסך ויתנגשו. "מדרגה" הוא המונח שכבר
      // מופיע ב-SKILL.md לשלוש הקבוצות.
      tag.innerHTML = `מדרגה ${ci+1} · <b>${ch.title}</b> · יעד ${(ch.goal/1000)}K`;
      root.appendChild(tag);

      const positions = ch.stations.map((_, i) => ((gi + i) % 2 === 0) ? 'r' : 'l');
      const nodes = document.createElement('div');
      nodes.className = 'nodes';

      ch.stations.forEach((s, i) => {
        const pos = positions[i];

        // נעול רק אם המתג למעלה דלוק. כרגע הוא כבוי ולכן הכל פתוח.
        const locked = PROGRESS_LOCK_ENABLED && s.id > done + 1;
        const isDone = stationDone(s);
        const hasContent = stationHasContent(s);
        // תחנה בלי שום תוכן (לא סרטון ולא שיעורים) לעולם לא לחיצה,
        // גם אם הנעילה הסדרתית כבויה. בקשת אוריאן 10.09.
        const state = locked ? 'locked'
                    : !hasContent ? 'empty'
                    : isDone ? 'done'
                    : (s.id === nextId ? 'active' : 'open');

        const node = document.createElement('div');
        node.className = `node ${state} p-${pos}`;

        let flag = '';
        if (s.id === 1) flag = '<div class="start-flag"><div class="box">START</div></div>';
        if (s.id === lastStationId) flag = '<div class="end-flag"><span class="star">★</span></div>';

        /* סימון תוכן · בקשת אוריאן 09.09, ועודכן 10.09.
           מודול עם שיעורים מציג מונה, סרטון בודד מציג "יש תוכן",
           ותחנה בלי שום וידאו מציגה כפתור "נעול" צהוב (לא לחיץ). */
        const nLes = Array.isArray(s.lessons) ? s.lessons.length : 0;
        const seen = nLes && window.OrianeLessons ? window.OrianeLessons.watchedCount(s.id) : 0;
        let lesLine;
        if (nLes) {
          lesLine = `<div class="lcount${seen >= nLes ? ' full' : ''}">` +
                    `<span class="n">${Math.min(seen, nLes)}/${nLes}</span> שיעורים</div>`;
        } else if (hasContent) {
          lesLine = `<div class="lcount ready">יש תוכן · שיעור אחד</div>`;
        } else {
          lesLine = `<div class="lockbtn">${window.icHTML ? window.icHTML('lock') : ''} נעול</div>`;
        }

        // תיאור קצר על הכרטיס. אותו מקור כמו מסך התחנה, נחתך ל-2 שורות ב-CSS.
        const descLine = s.desc ? `<div class="cdesc">${s.desc}</div>` : '';

        const label = state === 'active' ? 'התחנה הפעילה שלך'
                    : state === 'done'   ? 'הושלם'
                    : state === 'locked' ? 'נעול'
                    : '';

        node.innerHTML = `
          ${flag}
          <div class="pin-wrap"><div class="pin"><div class="num">${s.id}</div></div>${s.id === nextId ? walkerHtml : ''}</div>
          <div class="card">
            <div class="ic-box"><span data-ic="${(state==='locked'||state==='empty') ? 'lock' : 'target'}" style="width:16px;height:16px"></span></div>
            <div class="t">תחנה ${s.id} · ${s.name}</div>
            ${descLine}
            ${label ? `<div class="m">${label}</div>` : ''}
            ${lesLine}
          </div>`;
        if (state !== 'locked' && state !== 'empty') node.onclick = () => go(s.id);
        nodes.appendChild(node);
        pinEls.push(node.querySelector('.pin-wrap'));
      });

      root.appendChild(nodes);
      gi += ch.stations.length;
    });

    requestAnimationFrame(() => drawTrackAndFinish(root, pinEls));
    if (!window.__roadResizeBound) {
      window.__roadResizeBound = true;
      let t;
      window.addEventListener('resize', function () {
        clearTimeout(t);
        t = setTimeout(() => drawTrackAndFinish(root, pinEls), 150);
      });
    }

    updateProgress();
  }

  function updateProgress(){
    // נספרות רק תחנות שהושלמו באמת, ולא ברירת מחדל שהניחה שלוש.
    const doneCount = window.COURSE.allStations.filter(stationDone).length;
    nextId = firstOpenStationId();

    document.getElementById('pval').textContent = `${doneCount} / ${TOTAL} הושלמו`;
    document.getElementById('pfill').style.width = (doneCount / TOTAL * 100) + '%';
    const left = TOTAL - doneCount;
    document.getElementById('goalSub').textContent = left > 0 ? `עוד ${left} תחנות והגעת לפסגה` : 'הגעת לפסגה · 50K';
    document.getElementById('ctaContinue').href = 'station.html?id=' + nextId;

    // ---------- באנר "המשך לצפות" ----------
    // מציג את השיעור הבא עם התמונה הממוזערת שלו מיוטיוב, כתוספת מידע
    // מתחת לכפתור ה-CTA הראשי שבתמונת הבאנר העליון (שתמיד מוצג).
    (function () {
      var all = (window.COURSE && window.COURSE.allStations) || [];
      var next = all.filter(function (s) { return s.id === nextId; })[0];
      var ban = document.getElementById('nextBan');
      var cta = document.getElementById('ctaContinue');
      if (!next || !ban || !cta) return;

      var yt = next.youtubeId;
      var label = next.name, sub = next.tier || '';
      var href = 'station.html?id=' + next.id;

      // אם לתחנה יש שיעורים, מצביעים על השיעור הראשון שלה
      if (next.lessons && next.lessons.length) {
        yt = next.lessons[0].youtubeId || yt;
        label = next.lessons[0].n || label;
        sub = next.name + ' · ' + next.lessons.length + ' שיעורים';
        href += '&l=1';
      }
      cta.href = href;
      if (!yt) { ban.style.display = 'none'; return; }   // אין וידאו — נשארים עם כרטיס הבאנר בלבד

      document.getElementById('nbThumb').style.backgroundImage =
        'url(https://i.ytimg.com/vi/' + encodeURIComponent(yt) + '/mqdefault.jpg)';
      document.getElementById('nbKick').textContent = doneCount ? 'המשך לאן שהפסקת' : 'מתחילים כאן';
      document.getElementById('nbName').textContent = label;
      document.getElementById('nbSub').textContent = sub;
      ban.style.display = '';
      ban.onclick = function () { location.href = href; };
    })();
    // כרטיס "הקורס שלי" הוסר בבקשת אוריאן [פגישה 07.09, 20:02].
    // נשמרת בדיקת קיום כדי שהסרת אלמנט לא תפיל את כל הסקריפט.
    var fc = document.getElementById('featCourse');
    if (fc) fc.href = 'station.html?id=' + nextId;
  }

  render();

  /* ההתקדמות מהשרת מגיעה אחרי הציור הראשון, כי היא תלויה באימות.
     בלי הציור החוזר הזה תלמידה שנכנסה ממכשיר חדש הייתה רואה אפס
     ואז המספרים היו קופצים, או גרוע מזה, נשארים אפס עד רענון. */
  document.addEventListener('oriane:progress-synced', function (e) {
    var d = (e.detail && e.detail.stationDone) || 0;
    done = Math.max(0, Math.min(TOTAL, d));
    render();
  });

  /* ---------- מודאל הפתיח ----------
     הצופה נשאר על המפה. הכפתור התחתון מוביל לתחנה 1, בדיוק כפי
     שאוריאן תיארה: "אנשים ילחצו, ומשם הם יעברו לפרק אחד". */
  /* ⚠️ החיווט מושהה ל-DOMContentLoaded בכוונה: תגית המודאל יושבת בסוף
     ה-body, אחרי בלוק הסקריפט הזה, ולכן בזמן ריצה ישירה getElementById
     מחזיר null וההאזנה פשוט לא נרשמת — בשקט, בלי שגיאה. */
  function wireIntroModal() {
    const modal = document.getElementById('introModal');
    const frame = document.getElementById('vmFrame');
    const btn   = document.getElementById('spBtn');
    const xBtn  = document.getElementById('vmClose');
    const brand = window.COURSE.brand || {};
    if (!modal || !frame || !btn) return;

    const title = document.getElementById('vmTitle');
    if (title && brand.introTitle) title.textContent = brand.introTitle;

    function open() {
      frame.src = 'https://www.youtube.com/embed/' +
        encodeURIComponent(brand.introYoutubeId) + '?autoplay=1&rel=0';
      modal.classList.add('on');
      document.body.style.overflow = 'hidden';
    }
    // ⚠️ ריקון ה-src הוא חובה · בלעדיו היוטיוב ממשיך להשמיע ברקע
    //    אחרי הסגירה, וזה נשמע כמו באג במערכת.
    function close() {
      frame.src = '';
      modal.classList.remove('on');
      document.body.style.overflow = '';
    }

    btn.addEventListener('click', open);
    if (xBtn) xBtn.addEventListener('click', close);
    modal.addEventListener('click', function (e) { if (e.target === modal) close(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && modal.classList.contains('on')) close();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', wireIntroModal);
  } else {
    wireIntroModal();
  }
</script>
<!-- מודאל הפתיח · נשלט מכפתור הפליי הירוק בראש המפה -->
<div class="vm" id="introModal" role="dialog" aria-modal="true" aria-labelledby="vmTitle">
  <div class="vm-box">
    <div class="vm-head">
      <h3 id="vmTitle">פתיח</h3>
      <button class="vm-x" id="vmClose" aria-label="סגירה">&times;</button>
    </div>
    <div class="vm-video"><iframe id="vmFrame" src="" title="פתיח" allowfullscreen
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe></div>
    <div class="vm-foot"><a class="vm-next" id="vmNext" href="station.html?id=1">להתחיל מתחנה 1 →</a></div>
  </div>
</div>

<script src="js/ai-tutor.js"></script>
</body>
</html>
