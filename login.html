<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>כניסה · המסע ל-50K</title>
<link rel="stylesheet" href="css/portal.css">
<style>
  .wrap{max-width:420px;margin:0 auto;padding:40px 0 60px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:26px 22px}
  h1{font-size:26px;color:var(--text-strong);margin-bottom:6px}
  .sub{font-size:14.5px;color:var(--text-dim);margin-bottom:22px;line-height:1.55}
  label{display:block;font-size:13.5px;color:var(--text-dim);margin-bottom:7px}
  input{width:100%;padding:14px 15px;font-size:16px;font-family:inherit;direction:ltr;text-align:left;
    background:var(--input-bg);color:var(--text);border:1px solid var(--line);border-radius:var(--radius-pill);min-height:48px}
  input:focus{outline:none;border-color:var(--btn-bg)}
  button{width:100%;margin-top:14px;padding:15px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;
    background:var(--btn-bg);color:var(--btn-text);border:0;border-radius:var(--radius-pill);min-height:48px;transition:.15s}
  button:disabled{opacity:.55;cursor:default}
  .msg{margin-top:16px;padding:14px 16px;border-radius:var(--radius-card);font-size:14.5px;line-height:1.6;display:none}
  .msg.on{display:block}
  .msg.ok{background:var(--surface-2);border:1px solid var(--btn-bg);color:var(--text-strong)}
  .msg.err{background:var(--surface-2);border:1px solid var(--accent);color:var(--text-strong)}
  button.google{background:var(--surface);color:var(--text-strong);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;gap:10px;margin-top:0}
  button.google:hover{border-color:var(--btn-bg)}
  /* קישור "שכחתי סיסמה" · כפתור טקסטואלי, לא כפתור ראשי */
  button.linkish{background:none;border:0;color:var(--text-dim);font-size:12.5px;
    text-decoration:underline;min-height:44px;width:100%;margin-top:4px;cursor:pointer;
    font-family:inherit}
  button.linkish:hover{color:var(--text-strong)}
  .or{display:flex;align-items:center;gap:12px;margin:20px 0 4px;color:var(--text-faint);font-size:13px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  .hint{margin-top:18px;font-size:13px;color:var(--text-faint);line-height:1.6;text-align:center}
  .credit{margin-top:30px;text-align:center;font-size:12.5px;color:var(--text-faint)}
</style>
<script>
/* לוכד קוד הפניה מהכתובת ושומר אותו עד ההרשמה בפועל */
(function(){try{
  var r=new URLSearchParams(location.search).get('ref');
  if(r && /^[A-Za-z0-9_-]{4,32}$/.test(r)) localStorage.setItem('oriane_ref',r);
}catch(e){}})();
</script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>כניסה למסע</h1>
    <p class="sub">הכניסה מיועדת למשתתפים מאושרים בלבד. בחרו את הדרך הנוחה לכם.</p>

    <button id="btn-google" class="google" type="button">
      <svg viewBox="0 0 48 48" width="19" height="19" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.1 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.1 5.3-4.6 6.9l7.2 5.6c4.2-3.9 6.6-9.6 6.6-16.4z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.7-2.9-.7-4.4s.3-3 .7-4.4l-7.9-6.1C1 16.9 0 20.3 0 24s1 7.1 2.6 10.2l7.9-5.5z"/><path fill="#34A853" d="M24 48c6.3 0 11.7-2.1 15.6-5.7l-7.2-5.6c-2 1.4-4.7 2.3-8.4 2.3-6.3 0-11.6-3.6-13.5-8.8l-7.9 5.5C6.5 42.6 14.6 48 24 48z"/></svg>
      המשיכו עם Google
    </button>

    <div class="or"><span>או עם מייל וסיסמה</span></div>

    <form id="fpw" novalidate>
      <label for="pw-email">כתובת מייל</label>
      <input id="pw-email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
      <label for="pw-pass" style="margin-top:12px">סיסמה</label>
      <input id="pw-pass" type="password" autocomplete="current-password" placeholder="••••••••" required minlength="6">
      <button id="btn-pw" type="submit">כניסה עם סיסמה</button>
      <button id="btn-pw-signup" type="button" class="google" style="margin-top:10px">אין לי חשבון · הרשמה עם מייל וסיסמה</button>
      <button id="btn-forgot" type="button" class="linkish">שכחתי את הסיסמה</button>
    </form>

    <div class="msg" id="msg"></div>
    <p class="hint">הכניסה עם Google מיידית ובלי לזכור סיסמה.</p>
  </div>
  <div class="credit">נבנה ע"י <b>הלל אקנין</b></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/theme.js"></script>
<script>
(function () {
  'use strict';
  firebase.initializeApp(window.ORIANE_FB);
  var auth = firebase.auth();

  // מייל איפוס הסיסמה נשלח מ-Firebase לפי השפה שמוגדרת כאן.
  // בלי השורה הזו הוא יוצא באנגלית, וזה מייל שמגיע דווקא לאדם
  // שכבר נתקע בחוץ. עברית.
  auth.languageCode = 'he';
  var db = firebase.firestore();

  var msg = document.getElementById('msg');

  function say(text, kind) {
    msg.textContent = text;
    msg.className = 'msg on ' + kind;
  }

  var params = new URLSearchParams(location.search);
  // מגן מפני הפניה לאתר זר: מקבל רק שם דף פנימי, לא כתובת מלאה
  var next = params.get('next') || 'index.html';
  if (!/^[a-z0-9_-]+\.html(\?[^#]*)?$/i.test(next)) next = 'index.html';

  // הודעה מותאמת למי שהשער העיף החוצה
  var why = params.get('why');
  if (why === 'access-pending') {
    say('החשבון שלכם נוצר וממתין לאישור. תקבלו הודעה ברגע שהגישה תיפתח.', 'err');
  } else if (why === 'access-revoked') {
    say('הגישה לחשבון הזה נסגרה. אם זו טעות, פנו אלינו.', 'err');
  } else if (why === 'not-admin') {
    say('האזור הזה מיועד לניהול בלבד.', 'err');
  }

  // ---------- צינור אחד לשתי שיטות הכניסה ----------
  // גוגל ומייל+סיסמה מגיעים לכאן שניהם. השיטה קובעת רק *מי אתה*,
  // ולא *מה מותר לך*. הגישה נקבעת מרשימת ההזמנות, והכללים בצד השרת
  // חוסמים כל ניסיון להיווצר עם access פעיל בלי הזמנה תואמת.
  function afterSignIn(u) {
    var ref = db.collection('profiles').doc(u.uid);
    return ref.get().then(function (snap) {
      if (snap.exists) return;
      return db.collection('invites').doc((u.email || '').toLowerCase()).get()
        .then(function (inv) { return inv.exists; })
        .catch(function () { return false; })
        .then(function (invited) {
          return ref.set({
            email: u.email,
            full_name: u.displayName || '',
            phone: '',
            role: 'student',
            access: invited ? 'active' : 'pending',
            source: invited ? 'invite' : 'self',
            // הקהל נגזר מדרך הכניסה, ולא נשאל מהמשתמש.
            // מי שאוריאן הזמינה בשמה = יזמית שהיא מלווה = פרימיום, תוכן בלבד.
            // מי שנרשמה לבד = מנוי, ורואה את השכבה המסחרית.
            // אוריאן יכולה להפוך את ההחלטה במסך הניהול. נאכף גם בכללי השרת.
            audience: invited ? 'premium' : 'subscriber',
            referred_by: (localStorage.getItem('oriane_ref') || null),
            created_at: firebase.firestore.FieldValue.serverTimestamp()
          }).then(function () {
            // רשומת הפניה רזה, כדי שהמפנה תוכל לספור את עצמה.
            // שאילתה מול profiles פתוחה לאדמין בלבד, ולכן בלי זה
            // תלמידה מקבלת קישור בלי שום דרך לדעת אם הוא עבד.
            var code = localStorage.getItem('oriane_ref');
            if (!code || code === u.uid.slice(0, 8)) return;
            return db.collection('referrals').add({
              code: code,
              uid: u.uid,
              created_at: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(function (e) { console.error('[referral]', e); });
          });
        });
    }).then(function () {
      return ref.get();
    }).then(function (snap) {
      var p = snap.data() || {};
      if (p.access === 'active') {
        location.replace(next);
      } else {
        say('נכנסתם בהצלחה. החשבון ממתין לאישור גישה, ותקבלו הודעה כשייפתח.', 'ok');
      }
    });
  }

  // ---------- כניסה/הרשמה עם מייל וסיסמה ----------
  var fpw = document.getElementById('fpw');
  var pwEmail = document.getElementById('pw-email');
  var pwPass = document.getElementById('pw-pass');
  var btnPw = document.getElementById('btn-pw');
  var btnPwSignup = document.getElementById('btn-pw-signup');

  function pwCreds() {
    var v = (pwEmail.value || '').trim().toLowerCase();
    var p = (pwPass.value || '').trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) {
      say('נראה שכתובת המייל אינה תקינה. בדקו שוב.', 'err');
      return null;
    }
    if (p.length < 6) {
      say('הסיסמה חייבת להכיל לפחות 6 תווים.', 'err');
      return null;
    }
    return { email: v, pass: p };
  }

  function pwError(e) {
    var known = {
      'auth/user-not-found': 'לא נמצא חשבון עם המייל הזה. אפשר להירשם למטה.',
      'auth/wrong-password': 'הסיסמה שגויה. נסו שוב.',
      'auth/invalid-credential': 'מייל או סיסמה שגויים. נסו שוב.',
      'auth/email-already-in-use': 'כבר קיים חשבון עם המייל הזה. נסו להתחבר במקום להירשם.',
      'auth/weak-password': 'הסיסמה חלשה מדי. בחרו סיסמה עם לפחות 6 תווים.',
      'auth/operation-not-allowed': 'כניסה עם מייל וסיסמה עדיין לא הופעלה במערכת. פנו למנהל המערכת.',
      'auth/too-many-requests': 'יותר מדי ניסיונות. נסו שוב בעוד כמה דקות.'
    };
    say((e && known[e.code]) || 'משהו השתבש. נסו שוב.', 'err');
    console.error(e);
  }

  fpw.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var c = pwCreds();
    if (!c) return;
    btnPw.disabled = true;
    btnPw.textContent = 'מתחבר...';
    auth.signInWithEmailAndPassword(c.email, c.pass).then(function (res) {
      return afterSignIn(res.user);
    }).catch(function (e) {
      pwError(e);
    }).finally(function () {
      btnPw.disabled = false;
      btnPw.textContent = 'כניסה עם סיסמה';
    });
  });

  btnPwSignup.addEventListener('click', function () {
    var c = pwCreds();
    if (!c) return;
    btnPwSignup.disabled = true;
    btnPwSignup.textContent = 'נרשם...';
    auth.createUserWithEmailAndPassword(c.email, c.pass).then(function (res) {
      return afterSignIn(res.user);
    }).catch(function (e) {
      pwError(e);
    }).finally(function () {
      btnPwSignup.disabled = false;
      btnPwSignup.textContent = 'אין לי חשבון · הרשמה עם מייל וסיסמה';
    });
  });

  // ---------- כניסה עם גוגל ----------
  document.getElementById('btn-google').addEventListener('click', function () {
    var b = this;
    b.disabled = true;
    var provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    auth.signInWithPopup(provider).then(function (res) {
      return afterSignIn(res.user);
    }).catch(function (e) {
      b.disabled = false;
      if (e && e.code === 'auth/popup-closed-by-user') return;
      if (e && e.code === 'auth/operation-not-allowed') {
        say('הכניסה עם Google עדיין לא הופעלה במערכת. היכנסו עם מייל וסיסמה.', 'err');
      } else {
        say('הכניסה עם Google נכשלה. נסו שוב או היכנסו עם מייל וסיסמה.', 'err');
      }
      console.error(e);
    });
  });

  // ---------- שכחתי סיסמה ----------
  // רשת ביטחון חובה מרגע שביטלנו את הקישור למייל: בלי זה מי ששכחה
  // את הסיסמה ואין לה חשבון גוגל פשוט נעולה בחוץ.
  var btnForgot = document.getElementById('btn-forgot');
  btnForgot.addEventListener('click', function () {
    var v = (pwEmail.value || '').trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) {
      return say('הזינו קודם את כתובת המייל שלכם בשדה למעלה, ואז לחצו כאן.', 'err');
    }
    btnForgot.disabled = true;
    btnForgot.textContent = 'שולח...';
    auth.sendPasswordResetEmail(v).then(function () {
      // בכוונה לא מגלים אם המייל קיים במערכת, כדי לא לאפשר מיפוי משתמשות
      say('אם קיים חשבון עם ' + v + ', נשלח אליו מייל לאיפוס סיסמה. אם הוא לא מגיע, בדקו בספאם. ואם נכנסתם בעבר עם Google, אין סיסמה לאפס: פשוט לחצו על "המשיכו עם Google".', 'ok');
    }).catch(function (e) {
      if (e && e.code === 'auth/user-not-found') {
        say('אם קיים חשבון עם ' + v + ', נשלח אליו מייל לאיפוס סיסמה. אם הוא לא מגיע, בדקו בספאם. ואם נכנסתם בעבר עם Google, אין סיסמה לאפס: פשוט לחצו על "המשיכו עם Google".', 'ok');
      } else {
        say('לא הצלחנו לשלוח כרגע. נסו שוב בעוד רגע.', 'err');
        console.error(e);
      }
    }).finally(function () {
      btnForgot.disabled = false;
      btnForgot.textContent = 'שכחתי את הסיסמה';
    });
  });

  // ---------- כבר מחובר ----------
  auth.onAuthStateChanged(function (u) {
    if (!u) return;
    db.collection('profiles').doc(u.uid).get().then(function (snap) {
      if (snap.exists && snap.data().access === 'active') location.replace(next);
    });
  });
})();
</script>
</body>
</html>
