<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>כניסה · המסע ל-50K</title>
<link rel="stylesheet" href="css/portal.css">
<style>
  .wrap{max-width:420px;margin:0 auto;padding:40px 0 60px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:26px 22px}
  h1{font-size:26px;color:var(--text-strong);margin-bottom:6px}
  .sub{font-size:14.5px;color:var(--text-dim);margin-bottom:22px;line-height:1.55}
  label{display:block;font-size:13.5px;color:var(--text-dim);margin-bottom:7px}
  input{width:100%;padding:14px 15px;font-size:16px;font-family:inherit;direction:ltr;text-align:left;
    background:var(--input-bg);color:var(--text);border:1px solid var(--line);border-radius:var(--radius-pill);min-height:48px}
  input:focus{outline:none;border-color:var(--btn-bg)}
  button{width:100%;margin-top:14px;padding:15px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;
    background:var(--btn-bg);color:var(--btn-text);border:0;border-radius:var(--radius-pill);min-height:48px;transition:.15s}
  button:disabled{opacity:.55;cursor:default}
  .msg{margin-top:16px;padding:14px 16px;border-radius:var(--radius-card);font-size:14.5px;line-height:1.6;display:none}
  .msg.on{display:block}
  .msg.ok{background:var(--surface-2);border:1px solid var(--btn-bg);color:var(--text-strong)}
  .msg.err{background:var(--surface-2);border:1px solid var(--accent);color:var(--text-strong)}
  button.google{background:var(--surface);color:var(--text-strong);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;gap:10px;margin-top:0}
  button.google:hover{border-color:var(--btn-bg)}
  .or{display:flex;align-items:center;gap:12px;margin:20px 0 4px;color:var(--text-faint);font-size:13px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  .hint{margin-top:18px;font-size:13px;color:var(--text-faint);line-height:1.6;text-align:center}
  .credit{margin-top:30px;text-align:center;font-size:12.5px;color:var(--text-faint)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>כניסה למסע</h1>
    <p class="sub">הכניסה מיועדת למשתתפים מאושרים בלבד. בחרו את הדרך הנוחה לכם, ואין צורך בסיסמה.</p>

    <button id="btn-google" class="google" type="button">
      <svg viewBox="0 0 48 48" width="19" height="19" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.1 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.1 5.3-4.6 6.9l7.2 5.6c4.2-3.9 6.6-9.6 6.6-16.4z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.7-2.9-.7-4.4s.3-3 .7-4.4l-7.9-6.1C1 16.9 0 20.3 0 24s1 7.1 2.6 10.2l7.9-5.5z"/><path fill="#34A853" d="M24 48c6.3 0 11.7-2.1 15.6-5.7l-7.2-5.6c-2 1.4-4.7 2.3-8.4 2.3-6.3 0-11.6-3.6-13.5-8.8l-7.9 5.5C6.5 42.6 14.6 48 24 48z"/></svg>
      המשיכו עם Google
    </button>

    <div class="or"><span>או עם מייל</span></div>

    <form id="f" novalidate>
      <label for="email">כתובת מייל</label>
      <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
      <button id="btn" type="submit">שלחו לי קישור כניסה</button>
    </form>

    <div class="msg" id="msg"></div>
    <p class="hint">הכניסה עם Google מיידית. קישור במייל עלול להגיע לתיקיית הספאם.</p>
  </div>
  <div class="credit">נבנה ע"י <b>הלל אקנין</b></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/theme.js"></script>
<script>
(function () {
  'use strict';
  firebase.initializeApp(window.ORIANE_FB);
  var auth = firebase.auth();
  var db = firebase.firestore();

  var f = document.getElementById('f');
  var email = document.getElementById('email');
  var btn = document.getElementById('btn');
  var msg = document.getElementById('msg');
  var KEY = 'oriane_pending_email';

  function say(text, kind) {
    msg.textContent = text;
    msg.className = 'msg on ' + kind;
  }

  var params = new URLSearchParams(location.search);
  // מגן מפני הפניה לאתר זר: מקבל רק שם דף פנימי, לא כתובת מלאה
  var next = params.get('next') || 'index.html';
  if (!/^[a-z0-9_-]+\.html(\?[^#]*)?$/i.test(next)) next = 'index.html';

  // הודעה מותאמת למי שהשער העיף החוצה
  var why = params.get('why');
  if (why === 'access-pending') {
    say('החשבון שלכם נוצר וממתין לאישור. תקבלו הודעה ברגע שהגישה תיפתח.', 'err');
  } else if (why === 'access-revoked') {
    say('הגישה לחשבון הזה נסגרה. אם זו טעות, פנו אלינו.', 'err');
  } else if (why === 'not-admin') {
    say('האזור הזה מיועד לניהול בלבד.', 'err');
  }

  // ---------- צינור אחד לשתי שיטות הכניסה ----------
  // גוגל ולינק במייל מגיעים לכאן שניהם. השיטה קובעת רק *מי אתה*,
  // ולא *מה מותר לך*. הגישה נקבעת מרשימת ההזמנות, והכללים בצד השרת
  // חוסמים כל ניסיון להיווצר עם access פעיל בלי הזמנה תואמת.
  function afterSignIn(u) {
    var ref = db.collection('profiles').doc(u.uid);
    return ref.get().then(function (snap) {
      if (snap.exists) return;
      return db.collection('invites').doc((u.email || '').toLowerCase()).get()
        .then(function (inv) { return inv.exists; })
        .catch(function () { return false; })
        .then(function (invited) {
          return ref.set({
            email: u.email,
            full_name: u.displayName || '',
            phone: '',
            role: 'student',
            access: invited ? 'active' : 'pending',
            source: invited ? 'invite' : 'self',
            created_at: firebase.firestore.FieldValue.serverTimestamp()
          });
        });
    }).then(function () {
      return ref.get();
    }).then(function (snap) {
      var p = snap.data() || {};
      if (p.access === 'active') {
        location.replace(next);
      } else {
        say('נכנסתם בהצלחה. החשבון ממתין לאישור גישה, ותקבלו הודעה כשייפתח.', 'ok');
      }
    });
  }

  // ---------- כניסה עם גוגל ----------
  document.getElementById('btn-google').addEventListener('click', function () {
    var b = this;
    b.disabled = true;
    var provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    auth.signInWithPopup(provider).then(function (res) {
      return afterSignIn(res.user);
    }).catch(function (e) {
      b.disabled = false;
      if (e && e.code === 'auth/popup-closed-by-user') return;
      if (e && e.code === 'auth/operation-not-allowed') {
        say('הכניסה עם Google עדיין לא הופעלה במערכת. השתמשו בינתיים בקישור למייל.', 'err');
      } else {
        say('הכניסה עם Google נכשלה. נסו שוב או השתמשו בקישור למייל.', 'err');
      }
      console.error(e);
    });
  });

  // ---------- חזרה מהקישור במייל ----------
  if (auth.isSignInWithEmailLink(location.href)) {
    var saved = localStorage.getItem(KEY);
    if (!saved) {
      saved = window.prompt('לאישור הזהות, הזינו שוב את כתובת המייל שאליה נשלח הקישור');
    }
    if (saved) {
      say('מאמת את הקישור, רגע אחד...', 'ok');
      auth.signInWithEmailLink(saved, location.href).then(function (res) {
        localStorage.removeItem(KEY);
        return afterSignIn(res.user);
      }).catch(function (e) {
        say('הקישור אינו תקף יותר. בקשו קישור חדש למטה.', 'err');
        console.error(e);
      });
    }
  }

  // ---------- כבר מחובר ----------
  auth.onAuthStateChanged(function (u) {
    if (!u || auth.isSignInWithEmailLink(location.href)) return;
    db.collection('profiles').doc(u.uid).get().then(function (snap) {
      if (snap.exists && snap.data().access === 'active') location.replace(next);
    });
  });

  // ---------- שליחת הקישור ----------
  f.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var v = (email.value || '').trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) {
      return say('נראה שכתובת המייל אינה תקינה. בדקו שוב.', 'err');
    }
    btn.disabled = true;
    btn.textContent = 'שולח...';
    auth.sendSignInLinkToEmail(v, {
      url: location.origin + location.pathname + '?next=' + encodeURIComponent(next),
      handleCodeInApp: true
    }).then(function () {
      localStorage.setItem(KEY, v);
      say('שלחנו קישור כניסה אל ' + v + '. פתחו אותו מהמכשיר הזה. אם הוא לא מגיע, בדקו בספאם.', 'ok');
      btn.textContent = 'נשלח ✓';
    }).catch(function (e) {
      btn.disabled = false;
      btn.textContent = 'שלחו לי קישור כניסה';
      say('לא הצלחנו לשלוח כרגע. נסו שוב בעוד רגע.', 'err');
      console.error(e);
    });
  });
})();
</script>
</body>
</html>
